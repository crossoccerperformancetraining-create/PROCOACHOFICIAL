const $=id=>document.getElementById(id),safe=v=>Array.isArray(v)?v:[],obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};const day=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};const fmt=d=>{if(!d)return'—';const parts=String(d).split('-');return parts.length===3?`${parts[2]}/${parts[1]}`:String(d)};

ion?'· '+esc(a.location):''}</div></div>${a.url?`<button class="secondary open-activity" data-url="${esc(a.url)}">ABRIR</button>`:''}</div>${a.note?`<div class="status-line" style="margin-top:7px">${esc(a.note)}</div>`:''}<div class="mini-actions" style="margin-top:8px"><button class="${ar.status==='Concluído'?'success':'secondary'} complete-activity" data-id="${a.id}">${ar.status==='Concluído'?'✓ CONCLUÍDO':'MARCAR CONCLUÍDO'}</button></div></div>`}).join('')}</div>`:`<div class="card"><div class="row"><h3 class="grow">Atividade do dia</h3><button class="secondary" id="enable-alerts" style="min-height:36px">🔔 AVISOS</button></div><div class="empty">Nenhuma atividade específica para hoje.</div></div>`;return shell(`${urgent}${action}<div class="grid three"><div class="metric"><div class="label">Prontidão</div><b>${ready==null?'—':ready+'%'}</b></div><div class="metric"><div class="label">PSQ hoje</div><b>${w?'✓':'—'}</b></div><div class="metric"><div class="label">PSE hoje</div><b>${r?esc(r.rpe)+'/10':'—'}</b></div></div>${activities}${postAction}<div class="card"><h3>Pendências</h3><div class="row"><div class="grow muted">Bem-estar</div><span class="pill ${w?'ok':'warn'}">${w?'Respondido':'Pendente'}</span></div><div class="row" style="margin-top:10px"><div class="grow muted">PSE</div><span class="pill ${r?'ok':'warn'}">${r?'Respondido':'Após treino'}</span></div><div class="row" style="margin-top:10px"><div class="grow muted">Vídeos</div><span class="pill ${pending?'warn':'ok'}">${pending} pendente(s)</span></div></div><div class="card"><h3>Próximos compromissos</h3>${safe(data?.commitments).slice(0,4).map(c=>`<div class="video"><b>${esc(c.title||c.type||'Compromisso')}</b><div class="muted" style="margin-top:3px">${fmt(c.date)} ${esc(c.time||'')} · ${esc(c.location||'')}</div></div>`).join('')||'<div class="empty">Nenhum compromisso publicado.</div>'}</div>`)}
function scaleRow(k,l,w,help=''){return `<div><div class="row"><b class="grow" style="font-size:12px">${l}</b><span class="pill" id="val-${k}">${Number.isFinite(Number(w[k]))?w[k]:'—'}</span></div>${help?`<div class="muted" style="font-size:9px;margin-top:3px">${help}</div>`:''}<div class="scale" data-key="${k}">${[0,1,2,3,4,5].map(n=>`<button class="${Number(w[k])===n?'active':''}" data-v="${n}">${n}</button>`).join('')}</div></div>`}
function psqView(){const w=obj(responses().wellness)[day()]||{};const selected=safe(w.painLocations);return shell(`<div class="card"><div class="label">PSQ · ${fmt(day())}</div><h3>Como você está hoje?</h3><div class="notice">Escala 0–5: <b>0 = sem problema / condição muito boa</b> · <b>5 = muito ruim / muito alto</b>.</div>${scaleRow('sleep','Sono / recuperação',w,'0 = dormi muito bem · 5 = dormi muito mal')}${scaleRow('fatigue','Fadiga',w)}${scaleRow('pain','Dor / desconforto',w,'0 = sem dor · 5 = dor muito forte')}${scaleRow('stress','Estresse',w)}${scaleRow('mood','Disposição',w,'0 = muito disposto · 5 = muito indisposto')}<div class="divider"></div><div class="section-title">Local da dor</div><div class="muted">Toque em uma ou mais regiões. Se dor = 0, pode deixar sem seleção.</div><div class="pain-grid" id="pain-regions">${BODY_REGIONS.map(region=>`<button type="button" class="pain-chip ${selected.includes(region)?'active':''}" data-region="${esc(region)}">${esc(region)}</button>`).join('')}</div><label class="label">Tipo de dor / sensação</label><select class="field" id="pain-type"><option value="">Não informar</option>${['Muscular','Articular','Pontada','Rigidez','Peso / cansaço','Queimação','Impacto / trauma','Outro'].map(x=>`<option ${w.painType===x?'selected':''}>${x}</option>`).join('')}</select><label class="label" style="display:block;margin-top:12px">Disponibilidade para treinar</label><div class="availability" id="availability">${['100% disponível','Disponível com atenção','Limitado','Indisponível'].map(x=>`<button type="button" class="${w.availability===x?'active':''}" data-availability="${x}">${x}</button>`).join('')}</div><textarea class="field" id="psq-note" placeholder="Observação opcional">${esc(w.note||'')}</textarea><button class="primary" style="width:100%;margin-top:10px" id="save-psq">ENVIAR PSQ / BEM-ESTAR</button></div>`)}
function rpeView(){const r=obj(responses().rpe)[day()]||{};const selected=safe(r.postPainLocations);return shell(`<div class="card"><div class="label">PSE / RPE · ${fmt(day())}</div><h3>Como foi o esforço do treino?</h3><div class="muted">0 = repouso · 10 = esforço máximo</div><input class="field" id="rpe" type="range" min="0" max="10" value="${r.rpe??5}" style="padding:0"><div style="font-size:34px;font-weight:900;text-align:center;margin:10px 0" id="rpe-val">${r.rpe??5}/10</div><label class="label">Duração do treino</label><input class="field" id="dur" type="number" min="0" max="300" value="${r.duration??60}" placeholder="Minutos"><div class="divider"></div><label class="label">Sentiu dor durante ou depois da sessão?</label><select class="field" id="pain-during"><option ${r.painDuring==='Não'?'selected':''}>Não</option><option ${r.painDuring==='Sim'?'selected':''}>Sim</option></select><div class="row" style="margin-top:12px"><b class="grow" style="font-size:12px">Dor pós-treino (0–5)</b><span class="pill" id="post-pain-val">${r.postPain??0}</span></div><div class="scale" id="post-pain-scale">${[0,1,2,3,4,5].map(n=>`<button class="${Number(r.postPain||0)===n?'active':''}" data-v="${n}">${n}</button>`).join('')}</div><div class="section-title">Local da dor pós-treino</div><div class="pain-grid" id="post-pain-regions">${BODY_REGIONS.map(region=>`<button type="button" class="pain-chip ${selected.includes(region)?'active':''}" data-region="${esc(region)}">${esc(region)}</button>`).join('')}</div><textarea class="field" id="rpe-note" placeholder="Comentário opcional">${esc(r.note||'')}</textarea><button class="primary" style="width:100%;margin-top:10px" id="save-rpe">ENVIAR PSE</button></div>`)}
function videoView(){const vr=obj(responses().video);return shell(`<div class="card"><h3>Vídeos da comissão</h3>${safe(data?.videos).map(v=>{const s=vr[v.id]||{};return `<div class="video"><div class="row"><div class="grow"><span class="pill ${s.status?'ok':'warn'}">${esc(s.status||'Pendente')}</span><div style="font-weight:900;margin-top:7px">${esc(v.title||'Vídeo')}</div><div class="muted" style="margin-top:4px">${esc(v.type||'Correção')} ${v.due?'· até '+fmt(v.due):''} ${v.timecode?'· trecho '+esc(v.timecode):''}</div></div><button class="secondary open-video" data-id="${v.id}" data-url="${esc(v.url||'')}">▶ ABRIR</button></div>${v.note?`<div style="font-size:12px;line-height:1.5;margin-top:9px;color:#c7d2e0">${esc(v.note)}</div>`:''}<div class="mini-actions" style="margin-top:8px"><button class="secondary video-understood" data-id="${v.id}">ENTENDI</button><button class="secondary video-doubt" data-id="${v.id}">TENHO DÚVIDA</button></div><textarea class="field video-feedback" data-id="${v.id}" placeholder="Responder à comissão (opcional)">${esc(s.feedback||'')}</textarea><button class="secondary save-video" data-id="${v.id}" style="width:100%;margin-top:7px">ENVIAR RESPOSTA</button></div>`}).join('')||'<div class="empty">Nenhum vídeo enviado para você.</div>'}</div>`)}
function docsView(){return shell(`<div class="card"><h3>Meus documentos</h3>${safe(data?.documents).map(d=>`<div class="video row"><div class="grow"><b>${esc(d.type||'Documento')}</b><div class="muted">${esc(d.note||'')} ${d.expiry?'· vence '+fmt(d.expiry):''}</div></div>${d.url?`<a class="btn secondary" target="_blank" rel="noopener" href="${esc(d.url)}">ABRIR</a>`:'<span class="pill">Sem arquivo</span>'}</div>`).join('')||'<div class="empty">Nenhum documento foi liberado para o seu app.</div>'}</div>`)}
function activationView(error=false){return `<div class="card" style="margin-top:18px"><div class="label">Ativar acesso</div><h3>${error?'Não foi possível abrir este perfil':'Conecte seu ProCoach Athlete'}</h3><div class="muted" style="line-height:1.5;margin-bottom:10px">No ProCoach da comissão, abra Portal do atleta, publique o perfil e copie o link individual. Cole abaixo o link completo ou somente o código.</div>${error?`<div class="notice error">${esc(errorReason||'Este código não está ativo. Peça à comissão para publicar ou atualizar o perfil.')}</div>`:''}<input class="field" id="activation-code" value="${error?esc(token):''}" placeholder="Cole o link individual ou código de acesso"><button class="primary" id="activate-access" style="width:100%;margin-top:10px">${error?'TENTAR NOVAMENTE':'ATIVAR MEU APP'}</button><button class="secondary" id="clear-access" style="width:100%;margin-top:8px">LIMPAR ACESSO SALVO</button></div>`}
function parseAccess(value){const raw=String(value||'').trim();if(!raw)return'';try{const u=new URL(raw,location.href);return u.searchParams.get('token')||raw}catch(e){const m=raw.match(/[?&]token=([^&#]+)/);return m?decodeURIComponent(m[1]):raw}}
function bindActivation(){const a=$('activate-access'),c=$('clear-access');if(a)a.onclick=()=>{const next=parseAccess($('activation-code')?.value);if(!next){notice('Cole o link ou código enviado pela comissão.','error');return}token=next;errorReason='';try{localStorage.setItem('pc_athlete_last_token',token)}catch(e){}const u=new URL(location.href);u.searchParams.set('token',token);history.replaceState({},'',u.toString());status='loading';render();start()};if(c)c.onclick=()=>{try{localStorage.removeItem('pc_athlete_last_token');if(token)localStorage.removeItem('pc_athlete_portal_'+token)}catch(e){}if(liveSubscription){liveSubscription();liveSubscription=null}token='';data=null;errorReason='';status='activation';const u=new URL(location.href);u.searchParams.delete('token');history.replaceState({},'',u.toString());render()}}
function render(){const title=$('title'),sub=$('subtitle'),content=$('content');if(status==='loading'){content.innerHTML='<div class="empty">Validando o acesso com a comissão…</div>';return}if(status==='activation'||status==='error'){title.textContent='ProCoach Athlete';sub.textContent='Ative seu acesso individual';content.innerHTML=activationView(status==='error');$('nav').innerHTML='';bindActivation();return}title.textContent=data?.player?.name||'ProCoach Athlete';sub.textContent=(data?.teamName||'Equipe')+' · '+(navigator.onLine?'online':'modo offline');const views={today:todayView,psq:psqView,rpe:rpeView,video:videoView,docs:docsView};content.innerHTML=views[tab]();const nav=[['today','⌂','Hoje'],['psq','♡','PSQ'],['rpe','◉','PSE'],['video','▶','Vídeos'],['docs','▤','Docs']];$('nav').innerHTML=nav.map(([id,ic,l])=>`<button data-tab="${id}" class="${tab===id?'active':''}"><span class="ico">${ic}</span>${l}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});bind()}
function bind(){if(tab==='today'){const gp=$('go-psq'),gr=$('go-rpe'),ga=$('go-activities'),na=$('enable-alerts');if(gp)gp.onclick=()=>{tab='psq';render()};if(gr)gr.onclick=()=>{tab='rpe';render()};if(ga)ga.onclick=()=>document.getElementById('today-activities')?.scrollIntoView({behavior:'smooth'});if(na)na.onclick=requestNotifications;document.querySelectorAll('.open-activity').forEach(b=>b.onclick=()=>{if(b.dataset.url)window.open(b.dataset.url,'_blank','noopener')});document.querySelectorAll('.complete-activity').forEach(b=>b.onclick=()=>{const id=b.dataset.id;const next={...responses(),activity:{...obj(responses().activity),[id]:{status:'Concluído',at:new Date().toISOString()}}};patchResponses(next)})}
if(tab==='psq'){const original=obj(responses().wellness)[day()]||{};const draft={...original,painLocations:[...safe(original.painLocations)]};let availability=original.availability||'';document.querySelectorAll('.scale').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{draft[s.dataset.key]=Number(b.dataset.v);s.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));const x=$('val-'+s.dataset.key);if(x)x.textContent=b.dataset.v}));document.querySelectorAll('#pain-regions .pain-chip').forEach(b=>b.onclick=()=>{const region=b.dataset.region;if(draft.painLocations.includes(region))draft.painLocations=draft.painLocations.filter(x=>x!==region);else draft.painLocations.push(region);b.classList.toggle('active')});document.querySelectorAll('#availability button').forEach(b=>b.onclick=()=>{availability=b.dataset.availability;document.querySelectorAll('#availability button').forEach(x=>x.classList.toggle('active',x===b))});$('save-psq').onclick=()=>{const next={...responses(),wellness:{...obj(responses().wellness),[day()]:{sleep:Number(draft.sleep??0),fatigue:Number(draft.fatigue??0),pain:Number(draft.pain??0),stress:Number(draft.stress??0),mood:Number(draft.mood??0),painLocations:draft.painLocations,painType:$('pain-type').value,availability,note:$('psq-note').value,at:new Date().toISOString()}}};patchResponses(next)}}
if(tab==='rpe'){const r=obj(responses().rpe)[day()]||{};let postPain=Number(r.postPain||0),locations=[...safe(r.postPainLocations)];const slider=$('rpe');slider.oninput=()=>{$('rpe-val').textContent=slider.value+'/10'};document.querySelectorAll('#post-pain-scale button').forEach(b=>b.onclick=()=>{postPain=Number(b.dataset.v);$('post-pain-val').textContent=b.dataset.v;document.querySelectorAll('#post-pain-scale button').forEach(x=>x.classList.toggle('active',x===b))});document.querySelectorAll('#post-pain-regions .pain-chip').forEach(b=>b.onclick=()=>{const region=b.dataset.region;if(locations.includes(region))locations=locations.filter(x=>x!==region);else locations.push(region);b.classList.toggle('active')});$('save-rpe').onclick=()=>{const next={...responses(),rpe:{...obj(responses().rpe),[day()]:{rpe:Number(slider.value),duration:Number($('dur').value)||0,painDuring:$('pain-during').value,postPain,postPainLocations:locations,note:$('rpe-note').value,at:new Date().toISOString()}}};patchResponses(next)}}
if(tab==='video'){document.querySelectorAll('.open-video').forEach(b=>b.onclick=()=>{const id=b.dataset.id,url=b.dataset.url;const next={...responses(),video:{...obj(responses().video),[id]:{...obj(responses().video)[id],status:'Visto',at:new Date().toISOString()}}};patchResponses(next);if(url)window.open(url,'_blank','noopener')});document.querySelectorAll('.video-understood').forEach(b=>b.onclick=()=>{const id=b.dataset.id;const next={...responses(),video:{...obj(responses().video),[id]:{...obj(responses().video)[id],status:'Respondido',reaction:'Entendi',at:new Date().toISOString()}}};patchResponses(next)});document.querySelectorAll('.video-doubt').forEach(b=>b.onclick=()=>{const id=b.dataset.id;const next={...responses(),video:{...obj(responses().video),[id]:{...obj(responses().video)[id],status:'Respondido',reaction:'Tenho dúvida',at:new Date().toISOString()}}};patchResponses(next)});document.querySelectorAll('.save-video').forEach(b=>b.onclick=()=>{const id=b.dataset.id,feedback=document.querySelector(`.video-feedback[data-id="${id}"]`)?.value||'';const previous=obj(responses().video)[id]||{};const next={...responses(),video:{...obj(responses().video),[id]:{...previous,status:'Respondido',feedback,at:new Date().toISOString()}}};patchResponses(next)})}}
function accessError(error){const code=String(error?.code||'');if(!navigator.onLine)return'Sem conexão. Reconecte-se à internet ou abra um perfil já ativado neste aparelho.';if(code.includes('operation-not-allowed'))return'O acesso de atletas ainda não foi habilitado pela comissão.';if(code.includes('permission-denied'))return'O perfil existe, mas a permissão de acesso precisa ser liberada pela comissão.';if(code.includes('unavailable'))return'O servidor está temporariamente indisponível. Tente novamente em alguns instantes.';return'Não foi possível validar este código. Confirme se o perfil foi publicado novamente pela comissão.'}
async function start(){if(!token){status='activation';render();return}if(liveSubscription){liveSubscription();liveSubscription=null}const cached=loadCache();if(cached?.active!==false){data=cached;status='ready';render()}try{if(!db)throw new Error('Banco de dados indisponível');if(auth&&!auth.currentUser)await auth.signInAnonymously();liveSubscription=db.collection('athletePortal').doc(token).onSnapshot(doc=>{if(!doc.exists||doc.data()?.active===false){if(!data){errorReason='Este código não está ativo. No ProCoach, publique novamente o perfil deste atleta.';status='error';render()}return}data={...doc.data(),responses:doc.data().responses||data?.responses||{}};errorReason='';status='ready';saveCache();render();setTimeout(()=>maybeNotify(false),400)},error=>{if(!data){errorReason=accessError(error);status='error';render()}})}catch(error){if(!data){errorReason=accessError(error);status='error';render()}}}
try{const startUrl=token?'./atleta.html?token='+encodeURIComponent(token):'./atleta.html';const manifest={name:'ProCoach Athlete V4',short_name:'ProCoach Athlete',start_url:startUrl,scope:'./',display:'standalone',background_color:'#07101d',theme_color:'#07101d',icons:[{src:'./procoach-icon.svg',sizes:'any',type:'image/svg+xml'}]};const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});$('manifest-link').href=URL.createObjectURL(blob)}catch(e){}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;updateInstallUI()});window.addEventListener('appinstalled',()=>{installPrompt=null;updateInstallUI();notice('ProCoach Athlete instalado na Tela Inicial.','ok')});window.addEventListener('online',()=>render());window.addEventListener('offline',()=>render());document.addEventListener('DOMContentLoaded',()=>{const b=$('install-app');if(b)b.onclick=installApp;updateInstallUI()});setTimeout(()=>{const b=$('install-app');if(b)b.onclick=installApp;updateInstallUI()},0);start();
</script></body></html>
