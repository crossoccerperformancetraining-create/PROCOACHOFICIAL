<style>
:root{--bg:#07101d;--card:#0f1b2d;--line:#1e314b;--text:#f8fafc;--muted:#8da0b8;--primary:#2563eb;--ok:#10b981;--warn:#f59e0b}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#07101d,#0b1220);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;min-height:100dvh}.app{max-width:620px;margin:auto;min-height:100dvh;padding-bottom:92px}.top{padding:calc(18px + env(safe-area-inset-top)) 18px 16px;background:rgba(7,16,29,.94);position:sticky;top:0;z-index:4;border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.brand{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:#60a5fa;font-weight:900}.top h1{font-size:23px;margin:5px 0 2px}.muted{color:var(--muted);font-size:12px}.content{padding:16px}.hero{background:linear-gradient(135deg,#0d285d,#123a83);padding:18px;border-radius:22px;margin-bottom:14px;box-shadow:0 18px 45px rgba(0,0,0,.25)}.hero-row{display:flex;gap:12px;align-items:center}.avatar{width:58px;height:58px;border-radius:50%;overflow:hidden;background:#17253a;display:flex;align-items:center;justify-content:center;font-weight:900}.avatar img{width:100%;height:100%;object-fit:cover}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.metric,.card{background:rgba(15,27,45,.92);border:1px solid var(--line);border-radius:18px;padding:14px}.metric b{font-size:22px;display:block}.label{font-size:9px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}.card{margin-top:12px}.card h3{margin:0 0 10px;font-size:15px}button,.btn,input,select,textarea{font:inherit}button,.btn{border:0;border-radius:13px;min-height:46px;padding:0 14px;font-weight:900;font-size:11px;cursor:pointer}.primary{background:var(--primary);color:white}.secondary{background:#17253a;color:#dbeafe;border:1px solid #2b4364}.success{background:#0f7a58;color:white}.field{width:100%;min-height:48px;background:#091423;color:white;border:1px solid #29405f;border-radius:13px;padding:11px 12px;margin-top:8px;outline:none}.field:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(96,165,250,.15)}textarea.field{min-height:88px;resize:vertical}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0 13px}.scale button{min-height:42px;padding:0;background:#142237;color:#93a4bb;border:1px solid #233852}.scale button.active{background:#2563eb;color:white;border-color:#60a5fa}.video{padding:13px 0;border-top:1px solid var(--line)}.video:first-child{border-top:0}.pill{display:inline-flex;padding:5px 8px;border-radius:999px;background:#17253a;color:#a9bad0;font-size:8px;font-weight:900;text-transform:uppercase}.pill.ok{background:rgba(16,185,129,.13);color:#6ee7b7}.pill.warn{background:rgba(245,158,11,.13);color:#fbbf24}.row{display:flex;gap:9px;align-items:center}.grow{flex:1}.nav{position:fixed;bottom:0;left:0;right:0;max-width:620px;margin:auto;background:rgba(8,17,31,.97);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:5}.nav button{background:transparent;color:#71849d;padding:5px 2px;min-height:55px;font-size:8px;text-transform:uppercase}.nav button.active{color:#60a5fa}.nav .ico{font-size:18px;display:block;margin-bottom:3px}.notice{padding:11px 13px;border-radius:13px;background:#17253a;color:#b7c5d7;font-size:11px;margin-bottom:12px}.notice.error{background:#3b1720;color:#fecaca}.notice.ok{background:#0d3028;color:#a7f3d0}.empty{text-align:center;padding:35px 15px;color:#6f8299;font-size:12px}.daily-action{margin:0 0 14px;background:linear-gradient(135deg,#2563eb,#1d4ed8);border:1px solid rgba(147,197,253,.35);border-radius:20px;padding:16px;box-shadow:0 18px 45px rgba(37,99,235,.22)}.daily-action.done{background:linear-gradient(135deg,#0f766e,#047857)}.daily-action h2{font-size:18px;margin:0 0 5px}.daily-action p{font-size:11px;color:#dbeafe;margin:0 0 12px;line-height:1.45}.daily-action button{width:100%;background:white;color:#0f2f6f;min-height:50px;font-size:12px}.daily-action.done button{color:#065f46}.install-bar{display:none;margin:12px 16px 0;padding:12px;border:1px solid #2b4364;border-radius:16px;background:rgba(15,27,45,.97);box-shadow:0 12px 32px rgba(0,0,0,.22)}.install-bar.show{display:block}.install-bar .install-row{display:flex;gap:10px;align-items:center}.install-bar .install-copy{flex:1}.install-bar b{font-size:12px}.install-bar small{display:block;color:var(--muted);font-size:9px;line-height:1.4;margin-top:2px}.install-bar button{min-height:42px;padding:0 12px}.install-help{display:none;margin-top:9px;padding-top:9px;border-top:1px solid var(--line);font-size:10px;color:#cbd5e1;line-height:1.45}.install-help.show{display:block}@media(min-width:540px){.grid.three{grid-template-columns:repeat(3,1fr)}}

<body><div class="app"><div class="install-bar" id="install-bar"><div class="install-row"><div class="install-copy"><b>📲 Instalar ProCoach Athlete</b><small>Adicione o app à Tela Inicial para abrir com um toque.</small></div><button class="primary" id="install-app">INSTALAR</button></div><div class="install-help" id="install-help"></div></div><header class="top"><div class="brand">ProCoach Athlete</div><h1 id="title">Seu desempenho, em um só lugar</h1><div class="muted" id="subtitle">Conectando ao seu perfil…</div></header><main class="content" id="content"></main><nav class="nav" id="nav"></nav></div>
<script>
const firebaseConfig={apiKey:"AIzaSyBURvWmrRe-q-l1h2XKaQepeRQoNcmi7nk",authDomain:"procoachoficial.firebaseapp.com",projectId:"procoachoficial",storageBucket:"procoachoficial.firebasestorage.app",messagingSenderId:"128403842399",appId:"1:128403842399:web:c54259e2b6a5622fb942ea"};
try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig)}catch(e){};
const db=typeof firebase!=='undefined'?firebase.firestore():null,auth=typeof firebase!=='undefined'?firebase.auth():null;
const qs=new URLSearchParams(location.search),token=qs.get('token')||'';let data=null,tab='today',status='loading',installPrompt=null;
const $=id=>document.getElementById(id),safe=v=>Array.isArray(v)?v:[],obj=v=>v&&typeof v==='object'&&!Array.isArray(v)?v:{};const day=()=>{const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)};const fmt=d=>{if(!d)return'—';const [y,m,a]=d.split('-');return`${a}/${m}`};
function esc(v){return String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[s]))}
function saveCache(){try{localStorage.setItem('pc_athlete_portal_'+token,JSON.stringify(data))}catch(e){}}
function loadCache(){try{return JSON.parse(localStorage.getItem('pc_athlete_portal_'+token)||'null')}catch(e){return null}}
function readiness(w){if(!w)return null;const vals=['sleep','fatigue','pain','stress','mood'].map(k=>Number(w[k])||0).filter(Boolean);if(!vals.length)return null;const avg=vals.reduce((a,b)=>a+b,0)/vals.length;return Math.max(0,Math.min(100,Math.round(125-avg*25)))}
function responses(){return obj(data?.responses)}
async function patchResponses(next){if(!data)return;data={...data,responses:next};saveCache();render();if(!db||!token)return;try{await db.collection('athletePortal').doc(token).set({responses:next,lastAthleteUpdate:new Date().toISOString()},{merge:true});notice('Enviado para a comissão.','ok')}catch(e){notice('Salvo neste aparelho. A sincronização ocorrerá quando o acesso ao servidor estiver disponível.','error')}}
function notice(msg,type=''){const el=document.createElement('div');el.className='notice '+type;el.textContent=msg;document.querySelector('.content')?.prepend(el);setTimeout(()=>el.remove(),3500)}
function isStandalone(){return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true}function isIOS(){return /iphone|ipad|ipod/i.test(navigator.userAgent)}function updateInstallUI(){const bar=$('install-bar'),help=$('install-help'),btn=$('install-app');if(!bar||!btn)return;if(isStandalone()){bar.classList.remove('show');return}bar.classList.add('show');if(installPrompt){btn.textContent='INSTALAR';btn.disabled=false;help.classList.remove('show');help.textContent=''}else if(isIOS()){btn.textContent='COMO INSTALAR';btn.disabled=false;help.textContent='No iPhone: toque em Compartilhar no Safari e escolha “Adicionar à Tela de Início”.';}else{btn.textContent='ADICIONAR À TELA';btn.disabled=false;help.textContent='Se a instalação automática não aparecer, abra o menu do navegador e escolha “Instalar app” ou “Adicionar à tela inicial”.'}}async function installApp(){const help=$('install-help');if(installPrompt){installPrompt.prompt();try{await installPrompt.userChoice}catch(e){}installPrompt=null;updateInstallUI();return}if(help){help.classList.toggle('show');if(isIOS())help.textContent='No Safari: toque no botão Compartilhar (quadrado com seta para cima) → “Adicionar à Tela de Início” → Adicionar.';else help.textContent='Abra o menu do navegador (⋮ ou Compartilhar) e escolha “Instalar app” ou “Adicionar à tela inicial”.'}}
function shell(inner){const p=data?.player||{},r=obj(responses().wellness)[day()],rpe=obj(responses().rpe)[day()];return `<section class="hero"><div class="hero-row"><div class="avatar">${p.image?`<img src="${esc(p.image)}">`:(esc((p.name||'A').slice(0,1)))}</div><div class="grow"><div class="label" style="color:#93c5fd">${esc(data?.teamName||'PROCOACH')}</div><div style="font-size:20px;font-weight:900">${esc(p.name||'Atleta')}</div><div class="muted" style="color:#bfdbfe">${esc(p.pos||'')} ${p.number?'· #'+esc(p.number):''}</div></div></div>${data?.coachNote?`<div style="margin-top:14px;font-size:12px;line-height:1.5;color:#dbeafe"><b>Mensagem da comissão:</b> ${esc(data.coachNote)}</div>`:''}</section>${inner}`}
function todayView(){const w=obj(responses().wellness)[day()],r=obj(responses().rpe)[day()],ready=readiness(w);const vids=safe(data?.videos),pending=vids.filter(v=>obj(responses().video)[v.id]?.status!=='Visto'&&obj(responses().video)[v.id]?.status!=='Respondido').length;const action=w?`<div class="daily-action done"><h2>✓ Bem-estar respondido hoje</h2><p>Seu PSQ já foi enviado para a comissão. Você pode atualizar a resposta se alguma coisa mudar.</p><button id="go-psq">VER / ATUALIZAR BEM-ESTAR</button></div>`:`<div class="daily-action"><h2>Como você está hoje?</h2><p>Leva menos de 1 minuto. Responda sono, fadiga, dor, estresse e disposição antes das atividades.</p><button id="go-psq">RESPONDER BEM-ESTAR DE HOJE</button></div>`;const postAction=r?'':`<div class="card" style="border-color:#6b4f16;background:rgba(68,50,13,.28)"><div class="row"><div class="grow"><div class="label" style="color:#fbbf24">Depois do treino</div><h3 style="margin:0">Registrar PSE / RPE</h3><div class="muted">Informe esforço percebido e duração da sessão.</div></div><button class="secondary" id="go-rpe">RESPONDER</button></div></div>`;return shell(`${action}<div class="grid three"><div class="metric"><div class="label">Prontidão</div><b>${ready==null?'—':ready+'%'}</b></div><div class="metric"><div class="label">PSQ hoje</div><b>${w?'✓':'—'}</b></div><div class="metric"><div class="label">PSE hoje</div><b>${r?esc(r.rpe)+'/10':'—'}</b></div></div>${postAction}<div class="card"><h3>Pendências de hoje</h3><div class="row"><div class="grow muted">Questionário de bem-estar</div><span class="pill ${w?'ok':'warn'}">${w?'Respondido':'Pendente'}</span></div><div class="row" style="margin-top:10px"><div class="grow muted">Percepção de esforço</div><span class="pill ${r?'ok':'warn'}">${r?'Respondido':'Após treino'}</span></div><div class="row" style="margin-top:10px"><div class="grow muted">Vídeos para revisar</div><span class="pill ${pending?'warn':'ok'}">${pending} pendente(s)</span></div></div><div class="card"><h3>Próximos compromissos</h3>${safe(data?.commitments).slice(0,4).map(c=>`<div class="video"><b>${esc(c.title||c.type||'Compromisso')}</b><div class="muted" style="margin-top:3px">${fmt(c.date)} ${esc(c.time||'')} · ${esc(c.location||'')}</div></div>`).join('')||'<div class="empty">Nenhum compromisso publicado.</div>'}</div>`)}
function psqView(){const w=obj(responses().wellness)[day()]||{};const fields=[['sleep','Sono/recuperação'],['fatigue','Fadiga'],['pain','Dor muscular'],['stress','Estresse'],['mood','Disposição']];return shell(`<div class="card"><div class="label">PSQ · ${fmt(day())}</div><h3>Como você está hoje?</h3><div class="muted" style="margin-bottom:12px">1 = muito bem · 5 = muito mal / muito alto</div>${fields.map(([k,l])=>`<div><div class="row"><b class="grow" style="font-size:12px">${l}</b><span class="pill" id="val-${k}">${w[k]||'—'}</span></div><div class="scale" data-key="${k}">${[1,2,3,4,5].map(n=>`<button class="${Number(w[k])===n?'active':''}" data-v="${n}">${n}</button>`).join('')}</div></div>`).join('')}<textarea class="field" id="psq-note" placeholder="Observação opcional">${esc(w.note||'')}</textarea><button class="primary" style="width:100%;margin-top:10px" id="save-psq">ENVIAR PSQ / BEM-ESTAR</button></div>`)}
function rpeView(){const r=obj(responses().rpe)[day()]||{};return shell(`<div class="card"><div class="label">PSE / RPE · ${fmt(day())}</div><h3>Como foi o esforço do treino?</h3><div class="muted">0 = repouso · 10 = esforço máximo</div><input class="field" id="rpe" type="range" min="0" max="10" value="${r.rpe??5}" style="padding:0"><div style="font-size:34px;font-weight:900;text-align:center;margin:10px 0" id="rpe-val">${r.rpe??5}/10</div><label class="label">Duração do treino</label><input class="field" id="dur" type="number" min="0" max="300" value="${r.duration??60}" placeholder="Minutos"><textarea class="field" id="rpe-note" placeholder="Comentário opcional">${esc(r.note||'')}</textarea><button class="primary" style="width:100%;margin-top:10px" id="save-rpe">ENVIAR PSE</button></div>`)}
function videoView(){const vr=obj(responses().video);return shell(`<div class="card"><h3>Vídeos da comissão</h3>${safe(data?.videos).map(v=>{const s=vr[v.id]||{};return `<div class="video"><div class="row"><div class="grow"><span class="pill ${s.status?'ok':'warn'}">${esc(s.status||'Pendente')}</span><div style="font-weight:900;margin-top:7px">${esc(v.title)}</div><div class="muted" style="margin-top:4px">${esc(v.type||'Correção')} ${v.due?'· até '+fmt(v.due):''}</div></div><button class="secondary open-video" data-id="${v.id}" data-url="${esc(v.url)}">▶ ABRIR</button></div>${v.note?`<div style="font-size:12px;line-height:1.5;margin-top:9px;color:#c7d2e0">${esc(v.note)}</div>`:''}<textarea class="field video-feedback" data-id="${v.id}" placeholder="Responder à comissão (opcional)">${esc(s.feedback||'')}</textarea><button class="secondary save-video" data-id="${v.id}" style="width:100%;margin-top:7px">ENVIAR RESPOSTA</button></div>`}).join('')||'<div class="empty">Nenhum vídeo enviado para você.</div>'}</div>`)}
function docsView(){return shell(`<div class="card"><h3>Meus documentos</h3>${safe(data?.documents).map(d=>`<div class="video row"><div class="grow"><b>${esc(d.type||'Documento')}</b><div class="muted">${esc(d.note||'')} ${d.expiry?'· vence '+fmt(d.expiry):''}</div></div>${d.url?`<a class="btn secondary" target="_blank" rel="noopener" href="${esc(d.url)}">ABRIR</a>`:'<span class="pill">Sem arquivo</span>'}</div>`).join('')||'<div class="empty">Nenhum documento foi liberado para o seu app.</div>'}</div>`)}
function render(){const title=$('title'),sub=$('subtitle'),content=$('content');if(status==='loading'){content.innerHTML='<div class="empty">Carregando seu perfil…</div>';return}if(status==='error'){content.innerHTML='<div class="notice error">Não foi possível abrir este acesso. Solicite um novo link individual à comissão.</div>';return}title.textContent=data?.player?.name||'ProCoach Athlete';sub.textContent=(data?.teamName||'Equipe')+' · '+(navigator.onLine?'online':'modo offline');const views={today:todayView,psq:psqView,rpe:rpeView,video:videoView,docs:docsView};content.innerHTML=views[tab]();const nav=[['today','⌂','Hoje'],['psq','♡','PSQ'],['rpe','◉','PSE'],['video','▶','Vídeos'],['docs','▤','Docs']];$('nav').innerHTML=nav.map(([id,ic,l])=>`<button data-tab="${id}" class="${tab===id?'active':''}"><span class="ico">${ic}</span>${l}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});bind()}
function bind(){if(tab==='today'){const gp=$('go-psq'),gr=$('go-rpe');if(gp)gp.onclick=()=>{tab='psq';render()};if(gr)gr.onclick=()=>{tab='rpe';render()}}if(tab==='psq'){const draft={...obj(responses().wellness)[day()]};document.querySelectorAll('.scale').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{draft[s.dataset.key]=Number(b.dataset.v);renderPsqChoice(s,draft[s.dataset.key])}));function renderPsqChoice(s,v){s.querySelectorAll('button').forEach(b=>b.classList.toggle('active',Number(b.dataset.v)===v));const x=$('val-'+s.dataset.key);if(x)x.textContent=v}$('save-psq').onclick=()=>{const note=$('psq-note').value;const next={...responses(),wellness:{...obj(responses().wellness),[day()]:{sleep:draft.sleep||1,fatigue:draft.fatigue||1,pain:draft.pain||1,stress:draft.stress||1,mood:draft.mood||1,note,at:new Date().toISOString()}}};patchResponses(next)}}if(tab==='rpe'){const slider=$('rpe');slider.oninput=()=>{$('rpe-val').textContent=slider.value+'/10'};$('save-rpe').onclick=()=>{const next={...responses(),rpe:{...obj(responses().rpe),[day()]:{rpe:Number(slider.value),duration:Number($('dur').value)||0,note:$('rpe-note').value,at:new Date().toISOString()}}};patchResponses(next)}}if(tab==='video'){document.querySelectorAll('.open-video').forEach(b=>b.onclick=()=>{const id=b.dataset.id,url=b.dataset.url;const next={...responses(),video:{...obj(responses().video),[id]:{...obj(responses().video)[id],status:'Visto',at:new Date().toISOString()}}};patchResponses(next);if(url)window.open(url,'_blank','noopener')});document.querySelectorAll('.save-video').forEach(b=>b.onclick=()=>{const id=b.dataset.id,feedback=document.querySelector(`.video-feedback[data-id="${id}"]`)?.value||'';const next={...responses(),video:{...obj(responses().video),[id]:{status:'Respondido',feedback,at:new Date().toISOString()}}};patchResponses(next)})}}
async function start(){if(!token){status='error';render();return}const cached=loadCache();if(cached){data=cached;status='ready';render()}try{if(auth)await auth.signInAnonymously().catch(()=>null);if(!db)throw new Error('db');db.collection('athletePortal').doc(token).onSnapshot(doc=>{if(!doc.exists){if(!data){status='error';render()}return}data={...doc.data(),responses:doc.data().responses||data?.responses||{}};status='ready';saveCache();render()},()=>{if(!data){status='error';render()}})}catch(e){if(!data){status='error';render()}}}
try{const startUrl='./atleta.html?token='+encodeURIComponent(token);const manifest={name:'ProCoach Athlete',short_name:'ProCoach Athlete',start_url:startUrl,scope:'./',display:'standalone',background_color:'#07101d',theme_color:'#07101d',icons:[{src:'./procoach-icon.svg',sizes:'any',type:'image/svg+xml'}]};const blob=new Blob([JSON.stringify(manifest)],{type:'application/manifest+json'});$('manifest-link').href=URL.createObjectURL(blob)}catch(e){}
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;updateInstallUI()});window.addEventListener('appinstalled',()=>{installPrompt=null;updateInstallUI();notice('ProCoach Athlete instalado na Tela Inicial.','ok')});window.addEventListener('online',()=>render());window.addEventListener('offline',()=>render());document.addEventListener('DOMContentLoaded',()=>{const b=$('install-app');if(b)b.onclick=installApp;updateInstallUI()});setTimeout(()=>{const b=$('install-app');if(b)b.onclick=installApp;updateInstallUI()},0);start();
</script></body></html>
