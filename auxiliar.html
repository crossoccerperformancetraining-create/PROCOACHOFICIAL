<style>
:root{--bg:#06101d;--panel:#0d1d35;--panel2:#102743;--line:#244669;--blue:#3b82f6;--cyan:#22d3ee;--orange:#f97316;--text:#eff6ff;--muted:#8da6c8;--green:#10b981;--red:#ef4444;--amber:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,rgba(34,211,238,.10),transparent 25%),linear-gradient(180deg,#06101d,#09182d);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh}.hidden{display:none!important}button,input,textarea,select{font:inherit}.app{max-width:820px;margin:auto;min-height:100vh;padding:env(safe-area-inset-top) 14px calc(88px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:20;margin:0 -14px 12px;padding:12px 14px;background:rgba(6,16,29,.93);backdrop-filter:blur(16px);border-bottom:1px solid rgba(255,255,255,.07)}.brandrow{display:flex;align-items:center;gap:11px}.brandicon{width:48px;height:48px;border-radius:15px;background:#0a1b31;border:1px solid #315b84;display:flex;align-items:center;justify-content:center;overflow:hidden}.brandicon img{width:100%;height:100%;object-fit:contain}.eyebrow{font-size:8px;letter-spacing:.17em;font-weight:950;color:#67e8f9;text-transform:uppercase}.brand{font-size:19px;font-weight:950;line-height:1}.sub{font-size:9px;color:var(--muted);margin-top:4px}.topactions{margin-left:auto;display:flex;gap:7px}.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#0b1c34;color:#c7daf3}.teamline{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:11px}.field{width:100%;min-height:43px;border-radius:13px;border:1px solid var(--line);background:#08172a;color:#f8fbff;padding:9px 11px;outline:none}.field:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(59,130,246,.14)}.syncbadge{min-height:43px;padding:0 11px;border-radius:13px;border:1px solid rgba(16,185,129,.25);background:rgba(16,185,129,.09);color:#6ee7b7;font-size:9px;font-weight:900;display:flex;align-items:center;gap:6px}.syncbadge.off{border-color:rgba(245,158,11,.3);background:rgba(245,158,11,.08);color:#fbbf24}.hero{padding:18px;border-radius:24px;background:linear-gradient(135deg,#0b213f,#0d3157 60%,#0e7490);border:1px solid #2a5d7f;box-shadow:0 18px 42px rgba(0,0,0,.22)}.hero h1{margin:4px 0 4px;font-size:24px}.hero p{margin:0;color:#b8d4e8;font-size:11px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.kpi{padding:12px;border-radius:17px;background:linear-gradient(180deg,#0e213e,#0a182d);border:1px solid #213f62}.kpi small{display:block;font-size:7px;text-transform:uppercase;letter-spacing:.08em;color:#85a1c3;font-weight:900}.kpi b{display:block;font-size:22px;margin-top:4px}.card{margin-top:10px;padding:14px;border-radius:20px;background:linear-gradient(180deg,#0d1e37,#09172b);border:1px solid #213e60}.cardtitle{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.cardtitle h2{font-size:14px;margin:0}.tag{padding:5px 8px;border-radius:999px;background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.25);color:#fdba74;font-size:7px;font-weight:950;text-transform:uppercase}.list{display:grid;gap:7px}.drill{display:grid;grid-template-columns:76px 1fr auto;gap:9px;align-items:center;padding:8px;border-radius:14px;background:#081629;border:1px solid #203b5b}.thumb{width:76px;height:58px;border-radius:10px;overflow:hidden;background:#03110a;border:1px solid #21496a;display:flex;align-items:center;justify-content:center}.thumb img{width:100%;height:100%;object-fit:contain}.drill b{font-size:11px}.drill small{display:block;font-size:8px;color:#829bbb;margin-top:2px}.check{min-width:36px;height:36px;border-radius:11px;border:1px solid #2a4b71;background:#102540;color:#8ca8c8;font-weight:950}.check.done{background:#07664a;border-color:#10b981;color:#d1fae5}.person{display:grid;grid-template-columns:38px 1fr repeat(3,34px);gap:7px;align-items:center;padding:8px 0;border-bottom:1px solid #193451}.avatar{width:36px;height:36px;border-radius:50%;background:#102b4d;display:flex;align-items:center;justify-content:center;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.person b{font-size:10px}.person small{display:block;color:#7f99ba;font-size:8px}.statusbtn{width:34px;height:34px;border-radius:10px;border:1px solid #274769;background:#0d223e;color:#98b0cc;font-size:9px;font-weight:900}.statusbtn.present{background:#075f47;color:#d1fae5;border-color:#10b981}.statusbtn.absent{background:#5a1d27;color:#fecaca;border-color:#ef4444}.statusbtn.attn{background:#5b4308;color:#fde68a;border-color:#f59e0b}.note{min-height:110px;resize:vertical}.save{width:100%;min-height:48px;border:0;border-radius:14px;background:linear-gradient(135deg,#0891b2,#2563eb);color:white;font-weight:950;margin-top:8px}.secondary{min-height:42px;padding:0 12px;border-radius:12px;border:1px solid #2a4b71;background:#10213d;color:#dbeafe;font-weight:850}.checkgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.checkitem{padding:10px;border-radius:13px;background:#081629;border:1px solid #203c5d;display:flex;align-items:center;gap:8px;font-size:9px;font-weight:800}.checkitem input{width:18px;height:18px;accent-color:#22c55e}.match{padding:13px;border-radius:16px;background:linear-gradient(135deg,#39210d,#1d1720);border:1px solid #7c4617}.match b{display:block;font-size:16px}.match span{font-size:9px;color:#fdba74}.muted{color:#8199bb;font-size:9px}.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(820px,100%);z-index:25;padding:7px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:5px;background:rgba(6,16,29,.96);border-top:1px solid rgba(255,255,255,.08);backdrop-filter:blur(16px)}.nav button{min-height:54px;border:0;border-radius:13px;background:transparent;color:#7186a5;font-size:8px;font-weight:900}.nav button.active{background:#102844;color:#fff}.nav span{display:block;font-size:18px;margin-bottom:2px}.auth{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.authbox{width:min(420px,100%);padding:24px;border-radius:26px;background:#0b1b31;border:1px solid #26466e;box-shadow:0 28px 70px rgba(0,0,0,.35)}.authlogo{width:78px;height:78px;margin:auto;border-radius:22px;overflow:hidden}.authlogo img{width:100%;height:100%}.auth h1{text-align:center;margin:14px 0 5px}.auth p{text-align:center;color:#8ba4c5;font-size:10px;margin:0 0 18px}.auth .field{margin-top:8px}.autherr{color:#fca5a5;font-size:9px;margin-top:9px;text-align:center}.install{display:none}.install.show{display:block;margin-top:8px;width:100%}.empty{padding:22px;text-align:center;color:#728ba9;font-size:10px;border:1px dashed #29486b;border-radius:15px}.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:100;padding:10px 14px;border-radius:999px;background:#0d2948;border:1px solid #3b82f6;color:#eff6ff;font-size:9px;font-weight:900;box-shadow:0 12px 30px rgba(0,0,0,.35)}
@media(max-width:620px){.kpis{grid-template-columns:repeat(2,1fr)}.drill{grid-template-columns:70px 1fr auto}.thumb{width:70px}.person{grid-template-columns:34px 1fr repeat(3,31px)}.statusbtn{width:31px;height:31px}.teamline{grid-template-columns:1fr}.syncbadge{justify-content:center}.hero h1{font-size:21px}}
</style>

<body>
<div id="authView" class="auth"><div class="authbox"><div class="authlogo"><img src="./procoach-assistant-icon.svg" alt="Auxiliar"></div><h1>ProCoach Auxiliar</h1><p>Use o mesmo acesso autorizado do ProCoach principal para trabalhar na mesma equipe e no mesmo banco de dados.</p><input id="email" class="field" type="email" autocomplete="username" placeholder="E-mail"><input id="password" class="field" type="password" autocomplete="current-password" placeholder="Senha"><button id="loginBtn" class="save">ENTRAR</button><button id="installAuth" class="secondary install">Adicionar à tela inicial</button><div id="authErr" class="autherr"></div></div></div>
<div id="appView" class="app hidden">
<header class="top"><div class="brandrow"><div class="brandicon"><img src="./procoach-assistant-icon.svg"></div><div><div class="eyebrow">AC SOCCER · COMISSÃO</div><div class="brand">ProCoach Auxiliar</div><div class="sub">Apoio de campo · sincronização com o treinador</div></div><div class="topactions"><button id="refreshBtn" class="iconbtn" title="Sincronizar">↻</button><button id="logoutBtn" class="iconbtn" title="Sair">⇥</button></div></div><div class="teamline"><select id="teamSelect" class="field"></select><div id="syncBadge" class="syncbadge">● SINCRONIZADO</div></div></header>
<main id="screen"></main>
<nav class="nav" id="nav"><button data-tab="home" class="active"><span>⌂</span>HOJE</button><button data-tab="training"><span>⚽</span>TREINO</button><button data-tab="team"><span>👥</span>EQUIPE</button><button data-tab="match"><span>🏆</span>JOGO</button><button data-tab="record"><span>▤</span>REGISTRO</button></nav>
</div>
<script>
const firebaseConfig={apiKey:"AIzaSyBURvWmrRe-q-l1h2XKaQepeRQoNcmi7nk",authDomain:"procoachoficial.firebaseapp.com",projectId:"procoachoficial",storageBucket:"procoachoficial.firebasestorage.app",messagingSenderId:"128403842399",appId:"1:128403842399:web:c54259e2b6a5622fb942ea"};
try{if(!firebase.apps.length)firebase.initializeApp(firebaseConfig)}catch(e){}
const auth=firebase.auth(),db=firebase.firestore();
const PC_ACTIVE_TEAM_KEY='procoach_active_team_v6',PC_TEAM_REGISTRY_KEY='pc_multiteam_v6';
const PC_GLOBAL_KEYS=new Set([PC_TEAM_REGISTRY_KEY,'pc_dark_mode','pc_club_movements_v61','pc_club_season_archives_v61','pc_club_access_v61']);
const $=id=>document.getElementById(id),today=()=>new Date().toISOString().slice(0,10),ensureArray=v=>Array.isArray(v)?v:(v&&typeof v==='object'?Object.values(v):[]),parse=(raw,fallback)=>{try{return raw?JSON.parse(raw):fallback}catch(e){return fallback}};
let activeTab='home',installPrompt=null,cloudBusy=false;
const AUX_PENDING_KEY='procoach_aux_pending_sync_v2074';
const pendingQueue=()=>parse(localStorage.getItem(AUX_PENDING_KEY),[])||[];
const savePending=q=>localStorage.setItem(AUX_PENDING_KEY,JSON.stringify(q));
function queueSync(pk,value){const q=pendingQueue().filter(x=>x.pk!==pk);q.push({pk,value,at:new Date().toISOString()});savePending(q);setSync('pending');}
async function flushPending(){if(!auth.currentUser||!navigator.onLine)return false;const q=pendingQueue();if(!q.length)return true;setSync('syncing');try{for(const item of q){await db.collection('coachData').doc(auth.currentUser.uid).set({[item.pk]:item.value,lastUpdated:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});}savePending([]);setSync('ok');return true}catch(e){setSync('pending');return false}}
const activeTeamId=()=>localStorage.getItem(PC_ACTIVE_TEAM_KEY)||'team-main';
const physicalKey=(key,teamId=activeTeamId())=>(!String(key).startsWith('pc_')||PC_GLOBAL_KEYS.has(key)||teamId==='team-main')?key:`pc_team_${teamId}__${key}`;
const read=(key,fallback)=>parse(localStorage.getItem(physicalKey(key)),fallback);
const notify=(text)=>{const d=document.createElement('div');d.className='toast';d.textContent=text;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)};
const fmt=d=>{if(!d)return'—';const p=String(d).split('-');return p.length===3?`${p[2]}/${p[1]}`:d};
async function write(key,value){const pk=physicalKey(key),raw=JSON.stringify(value);localStorage.setItem(pk,raw);if(auth.currentUser&&navigator.onLine){try{await db.collection('coachData').doc(auth.currentUser.uid).set({[pk]:raw,lastUpdated:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});const q=pendingQueue().filter(x=>x.pk!==pk);savePending(q);setSync(q.length?'pending':'ok')}catch(e){queueSync(pk,raw)}}else{queueSync(pk,raw)}render();}
async function cloudLoad(){if(!auth.currentUser||cloudBusy)return;cloudBusy=true;setSync('syncing');try{await flushPending();const doc=await db.collection('coachData').doc(auth.currentUser.uid).get();if(doc.exists){const data=doc.data();Object.keys(data).forEach(k=>{if(k.startsWith('pc_'))localStorage.setItem(k,typeof data[k]==='string'?data[k]:JSON.stringify(data[k]))});}setSync(pendingQueue().length?'pending':'ok');renderTeamSelect();render();}catch(e){setSync(navigator.onLine?'pending':'off');}finally{cloudBusy=false}}
function setSync(state){const b=$('syncBadge');if(!b)return;const n=pendingQueue().length;b.classList.toggle('off',state!=='ok');b.textContent=state==='syncing'?'↻ SINCRONIZANDO':state==='ok'?'● SINCRONIZADO':state==='pending'?`● ${n||1} PENDENTE(S)`:'● MODO LOCAL';}
function registry(){return read(PC_TEAM_REGISTRY_KEY,{teams:[{id:'team-main',name:'Equipe Principal',category:'Principal'}]})}
function team(){return ensureArray(registry().teams).find(t=>t.id===activeTeamId())||{id:'team-main',name:read('pc_team_name','Equipe Principal'),category:'Principal'}}
function teamName(){return read('pc_team_name',team().name||'Equipe Principal')}
function players(){return ensureArray(read('pc_players',[]))}
function history(){return read('pc_history_v2',{})||{}}
function weekdayKey(){return['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'][new Date().getDay()]}
function currentSession(){const h=history(),date=today();if(h[date])return{...h[date],date};const micro=read('pc_micro_v7',{}),day=micro?.[weekdayKey()]||{};return{date,header:read('pc_header',{}),drills:ensureArray(day.exercises),attendance:{},assistantNote:'',assistantChecklist:{}}}
function currentDrills(){return ensureArray(currentSession().drills)}
function wellness(){return ensureArray(read('pc_wellness_v1',[])).filter(x=>x.date===today())}
function nextMatch(){const all=ensureArray(read('pc_match_history',[])).filter(x=>x&&x.date).sort((a,b)=>String(a.date).localeCompare(String(b.date)));return all.find(x=>x.date>=today())||read('pc_match_report',{})||{};}
function renderTeamSelect(){const s=$('teamSelect');if(!s)return;const teams=ensureArray(registry().teams).filter(t=>!t.archived);s.innerHTML=teams.map(t=>`<option value="${esc(t.id)}" ${t.id===activeTeamId()?'selected':''}>${esc(t.name||t.category||'Equipe')} · ${esc(t.category||'')}</option>`).join('')||'<option value="team-main">Equipe Principal</option>';}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function drillImg(d){return d?.image||d?.imageUrl||(ensureArray(d?.images)[0]?.url||ensureArray(d?.images)[0]||'')}
function drillList(){const done=new Set(ensureArray(currentSession().assistantProgress));return currentDrills().map((d,i)=>`<div class="drill"><div class="thumb">${drillImg(d)?`<img src="${esc(drillImg(d))}">`:'⚽'}</div><div><b>${i+1}. ${esc(d.name||'Exercício')}</b><small>${esc(d.block||d.method||'Treino')} · ${esc(d.time||0)} min · ${esc(d.dim||d.space||'espaço livre')}</small></div><button class="check ${done.has(String(d.id||i))?'done':''}" onclick="toggleDrill('${esc(String(d.id||i))}')">✓</button></div>`).join('')||'<div class="empty">Nenhum exercício programado para hoje.</div>'}
async function toggleDrill(id){const h=history(),date=today(),rec=h[date]||currentSession(),set=new Set(ensureArray(rec.assistantProgress).map(String));set.has(String(id))?set.delete(String(id)):set.add(String(id));h[date]={...rec,drills:ensureArray(rec.drills||currentDrills()),assistantProgress:[...set],assistantUpdatedAt:new Date().toISOString()};await write('pc_history_v2',h);notify('Progresso atualizado');}
function attendanceStats(){const rec=currentSession(),att=rec.attendance||{},p=players();let present=0,absent=0,attention=0;p.forEach((_,i)=>{const v=att[i];if(v==='Presente')present++;else if(v==='Ausente')absent++;else if(v==='Atenção')attention++;});return{present,absent,attention,total:p.length}}
async function setAttendance(i,status){const h=history(),date=today(),rec=h[date]||currentSession(),att={...(rec.attendance||{}),[i]:status};h[date]={...rec,drills:ensureArray(rec.drills||currentDrills()),attendance:att,assistantUpdatedAt:new Date().toISOString()};await write('pc_history_v2',h);}
async function saveRecord(){const h=history(),date=today(),rec=h[date]||currentSession();const checklist={materials:$('cMaterials')?.checked||false,field:$('cField')?.checked||false,equipment:$('cEquipment')?.checked||false,video:$('cVideo')?.checked||false,meeting:$('cMeeting')?.checked||false};h[date]={...rec,drills:ensureArray(rec.drills||currentDrills()),assistantNote:$('assistantNote')?.value||'',assistantChecklist:checklist,assistantUpdatedAt:new Date().toISOString()};await write('pc_history_v2',h);notify('Registro sincronizado com o treinador');}
function home(){const s=currentSession(),p=players(),a=attendanceStats(),w=wellness(),pain=w.filter(x=>Number(x.pain)>=3).length,done=ensureArray(s.assistantProgress).length,d=currentDrills();return`<section class="hero"><div class="eyebrow">CENTRAL DO AUXILIAR · ${fmt(today())}</div><h1>${esc(teamName())}</h1><p>Treino, presença e registro de campo sincronizados com o ProCoach principal.</p></section><div class="kpis"><div class="kpi"><small>Atletas</small><b>${p.length}</b></div><div class="kpi"><small>Exercícios</small><b>${d.length}</b></div><div class="kpi"><small>Presentes</small><b>${a.present}</b></div><div class="kpi"><small>Alertas dor</small><b>${pain}</b></div></div><section class="card"><div class="cardtitle"><h2>Treino de hoje</h2><span class="tag">${esc(s.header?.trainingType||'Campo')}</span></div>${drillList()}<div class="muted" style="margin-top:8px">Concluídos pelo auxiliar: ${done}/${d.length}</div></section>${matchCard()}`}
function training(){const s=currentSession();return`<section class="card"><div class="cardtitle"><div><div class="eyebrow">TREINO DO DIA</div><h2>${fmt(today())} · ${esc(s.header?.local||'CT')} · ${esc(s.header?.time||'')}</h2></div><span class="tag">${esc(s.header?.trainingType||'Campo')}</span></div>${drillList()}</section>`}
function teamScreen(){const rec=currentSession(),att=rec.attendance||{};return`<section class="card"><div class="cardtitle"><div><div class="eyebrow">PRESENÇA EM CAMPO</div><h2>${esc(teamName())}</h2></div><span class="tag">${players().length} atletas</span></div><div>${players().map((p,i)=>`<div class="person"><div class="avatar">${p.image?`<img src="${esc(p.image)}">`:'👤'}</div><div><b>${esc(p.name||`Atleta ${i+1}`)}</b><small>${esc(p.pos||'')}</small></div><button class="statusbtn ${att[i]==='Presente'?'present':''}" onclick="setAttendance(${i},'Presente')">P</button><button class="statusbtn ${att[i]==='Atenção'?'attn':''}" onclick="setAttendance(${i},'Atenção')">!</button><button class="statusbtn ${att[i]==='Ausente'?'absent':''}" onclick="setAttendance(${i},'Ausente')">A</button></div>`).join('')||'<div class="empty">Sem atletas cadastrados.</div>'}</div></section>`}
function matchCard(){const m=nextMatch();if(!m||(!m.date&&!m.opponent))return'';return`<section class="card"><div class="cardtitle"><h2>Próximo jogo</h2><span class="tag">MATCH DAY</span></div><div class="match"><span>${fmt(m.date||today())} · ${esc(m.time||'')}</span><b>${esc(teamName())} × ${esc(m.opponent||'Adversário')}</b><div class="muted">${esc(m.location||m.venue||'Local a definir')} ${m.system?`· Sistema ${esc(m.system)}`:''}</div></div></section>`}
function matchScreen(){const m=nextMatch(),callups=ensureArray(read('pc_callups_v1',[])).filter(x=>x.date===m.date||x.date===today());return`<section class="card"><div class="cardtitle"><div><div class="eyebrow">JOGO & LOGÍSTICA</div><h2>${m.opponent?esc(m.opponent):'Sem jogo programado'}</h2></div><span class="tag">${callups.length?callups.length+' convocação(ões)':'GAME CENTER'}</span></div>${matchCard()||'<div class="empty">Nenhum jogo encontrado.</div>'}</section>`}
function recordScreen(){const r=currentSession(),c=r.assistantChecklist||{};return`<section class="card"><div class="cardtitle"><div><div class="eyebrow">REGISTRO DO AUXILIAR</div><h2>Checklist e observações</h2></div><span class="tag">SYNC</span></div><div class="checkgrid"><label class="checkitem"><input id="cMaterials" type="checkbox" ${c.materials?'checked':''}> Materiais separados</label><label class="checkitem"><input id="cField" type="checkbox" ${c.field?'checked':''}> Campo preparado</label><label class="checkitem"><input id="cEquipment" type="checkbox" ${c.equipment?'checked':''}> Equipamentos OK</label><label class="checkitem"><input id="cVideo" type="checkbox" ${c.video?'checked':''}> Vídeo / tablet OK</label><label class="checkitem"><input id="cMeeting" type="checkbox" ${c.meeting?'checked':''}> Reunião alinhada</label></div><textarea id="assistantNote" class="field note" placeholder="Observações do auxiliar: campo, clima, material, comportamento, ajustes da sessão...">${esc(r.assistantNote||'')}</textarea><button class="save" onclick="saveRecord()">SALVAR E SINCRONIZAR</button><div class="muted" style="margin-top:8px">Esta nota também aparece na ficha de treino do ProCoach principal após a sincronização.</div></section>`}
function render(){if($('appView').classList.contains('hidden'))return;const map={home,training,team:teamScreen,match:matchScreen,record:recordScreen};$('screen').innerHTML=(map[activeTab]||home)();document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));setSync(!navigator.onLine?'off':pendingQueue().length?'pending':'ok')}
$('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-tab]');if(!b)return;activeTab=b.dataset.tab;render()});
$('teamSelect').addEventListener('change',e=>{localStorage.setItem(PC_ACTIVE_TEAM_KEY,e.target.value);render()});
$('refreshBtn').onclick=cloudLoad;$('logoutBtn').onclick=()=>auth.signOut();
$('loginBtn').onclick=async()=>{const email=$('email').value.trim(),pass=$('password').value;$('authErr').textContent='';try{await auth.signInWithEmailAndPassword(email,pass)}catch(e){$('authErr').textContent='Não foi possível entrar. Confira e-mail e senha.'}};
window.addEventListener('online',async()=>{setSync('syncing');await flushPending();cloudLoad()});window.addEventListener('offline',()=>setSync('off'));
auth.onAuthStateChanged(async user=>{if(user){$('authView').classList.add('hidden');$('appView').classList.remove('hidden');await cloudLoad();renderTeamSelect();render()}else{$('appView').classList.add('hidden');$('authView').classList.remove('hidden')}});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e;$('installAuth').classList.add('show')});$('installAuth').onclick=async()=>{if(!installPrompt)return;installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$('installAuth').classList.remove('show')};
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js?v=2074',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{}));
</script>
</body>
</html>
