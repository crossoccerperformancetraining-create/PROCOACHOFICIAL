<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>ProCoach 2.0.6.1 - Ficha Premium</title><style>
@page{size:A4 portrait;margin:5mm}*{box-sizing:border-box;-webkit-print-color-adjust:exact;print-color-adjust:exact}body{margin:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#0f172a}.page{width:200mm;min-height:286mm;margin:0 auto 5mm;page-break-after:always}.page:last-child{page-break-after:auto}.sheet{min-height:286mm;background:#07101e;border:1.2mm solid #12365f;border-radius:4mm;padding:2.6mm;position:relative;overflow:hidden}.sheet:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 8% 2%,rgba(59,130,246,.12),transparent 22%),radial-gradient(circle at 100% 100%,rgba(249,115,22,.08),transparent 20%);pointer-events:none}.header{height:27mm;border-radius:2.5mm;padding:3.8mm 4.5mm;background:linear-gradient(118deg,#07101e,#0b3158 67%,#123f73);border:1px solid #315d8a;color:#fff;display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;overflow:hidden}.header:after{content:'';position:absolute;width:36mm;height:36mm;border:1px solid rgba(255,255,255,.1);border-radius:50%;right:-8mm;top:-20mm;box-shadow:0 0 0 7mm rgba(255,255,255,.025)}.brand{display:flex;align-items:center;gap:4mm}.logo{width:18mm;height:18mm;border-radius:3mm;border:1px solid #78a5d4;background:#0a1e35;display:flex;align-items:center;justify-content:center;color:#ff8a3d;font-size:14pt;font-weight:900}.kicker{font-size:5.2pt;letter-spacing:.18em;font-weight:900;color:#88c5ff}.header h1{font-size:15.2pt;margin:1mm 0 .7mm;line-height:1;font-weight:950}.header h1 span{color:#ff812d}.header p{font-size:6pt;color:#cbd5e1;margin:0;font-weight:700}.date{text-align:right;position:relative;z-index:2}.date small{display:block;font-size:4.6pt;color:#8fc5f5;font-weight:900}.date b{display:block;font-size:11.5pt;margin-top:.6mm}.date span{display:block;font-size:5pt;color:#c7d4e4;margin-top:.4mm}.motto{font-size:4pt;color:#b8c9df;text-transform:uppercase;letter-spacing:.08em;line-height:1.35;margin-top:1mm}.meta{position:relative;z-index:1;display:grid;grid-template-columns:1.4fr 1.2fr 1fr 2.5fr .9fr .8fr;gap:.7mm;margin-top:1.2mm;background:#dbe5ef;border-radius:1.8mm;padding:.7mm}.meta>div{padding:1.35mm 1.6mm;background:#f7fafc;border-right:1px solid #c3d0dd;min-width:0}.meta>div:last-child{border-right:0}.meta small{font-size:3.6pt;color:#526b87;font-weight:900;display:block}.meta b{font-size:5.6pt;display:block;margin-top:.3mm;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sequence{display:grid;grid-template-columns:repeat(6,1fr);gap:.7mm;margin-top:1.1mm;position:relative;z-index:1}.step{height:8mm;border-radius:1.4mm;background:linear-gradient(120deg,#16467d,#1870c6);border:1px solid #3c7ab5;color:#fff;display:flex;align-items:center;gap:1mm;padding:0 1.2mm;overflow:hidden}.step:after{content:'';width:0;height:0;border-top:4mm solid transparent;border-bottom:4mm solid transparent;border-left:3mm solid #f97316;margin-left:auto}.step i{width:4.8mm;height:4.8mm;border-radius:50%;background:#f97316;border:1px solid #ffb174;display:flex;align-items:center;justify-content:center;font-size:4pt;font-weight:900;font-style:normal}.step b{font-size:4.25pt;text-transform:uppercase;line-height:1.05}.body{display:grid;grid-template-columns:18mm 1fr;gap:1.2mm;margin-top:1.3mm;position:relative;z-index:1}.check{border-radius:1.8mm;background:linear-gradient(180deg,#06101d,#09223d);border:1px solid #315b84;color:#fff;padding:2.1mm 1.5mm}.check h3{font-size:6.3pt;border-bottom:1px solid #f97316;padding-bottom:1.4mm;margin:0 0 1mm}.stat{padding:1.2mm 0;border-bottom:1px solid rgba(255,255,255,.12)}.stat small{display:block;font-size:3.4pt;color:#8fc5f5;font-weight:900}.stat b{font-size:6.8pt;display:block;margin-top:.3mm}.values{display:grid;gap:1.4mm;padding-top:2.3mm}.values span{font-size:3.45pt;color:#cbd5e1;padding:1mm .3mm;border-bottom:1px solid rgba(255,255,255,.08);font-weight:800}.main{display:grid;gap:.9mm}.block{border:1px solid #9fb4ca;border-radius:1.6mm;overflow:hidden;background:#f8fbff}.blockhead{height:6.2mm;padding:0 1.5mm;background:#0b2c4d;border-bottom:.55mm solid #f97316;color:#fff;display:flex;align-items:center;gap:1mm}.blockhead i{width:4.7mm;height:4.7mm;border-radius:50%;background:#f97316;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:4pt;font-weight:900}.blockhead b{font-size:5.6pt;text-transform:uppercase;flex:1}.blockhead small{font-size:3.8pt;color:#acd3f7}.ex{display:grid;grid-template-columns:29mm 34mm 1fr 47mm;min-height:19.4mm;border-top:1px solid #ced9e5;background:#fff}.blockhead+.ex{border-top:0}.title{padding:1.25mm 1.4mm;background:#f8fbff}.title b{display:block;font-size:5.4pt;line-height:1.1}.title small{display:block;font-size:3.6pt;color:#72859a;margin-top:.7mm}.media{display:grid;grid-template-columns:1fr 1fr;gap:.5mm;padding:.85mm;background:#eaf0f6}.pic{height:17.6mm;border:1px solid #c7d3df;border-radius:.8mm;background:#fff;overflow:hidden;display:flex;align-items:center;justify-content:center}.pic svg{width:100%;height:100%}.pres{display:grid;grid-template-columns:repeat(3,1fr);gap:.45mm;padding:.75mm;align-content:center}.pres div{padding:.55mm .35mm;border:1px solid #d3dee9;border-radius:.8mm;background:#f6f9fc;text-align:center}.pres small{display:block;font-size:2.85pt;color:#64748b;font-weight:900}.pres b{font-size:4.45pt;display:block;margin-top:.2mm}.tips{padding:1mm;border-left:1px solid #d0dbe7;background:#fafdff}.tips small{font-size:3pt;color:#56718f;font-weight:900}.tips p{font-size:3.75pt;line-height:1.2;margin:.55mm 0 0}.final{margin-top:1.2mm;min-height:13mm;border-radius:1.7mm;background:#0b2c4d;border:1px solid #315f8d;color:#fff;padding:1.5mm 2mm;display:grid;grid-template-columns:19mm 19mm 27mm 1fr;gap:2mm;position:relative;z-index:1}.final small{font-size:3.5pt;color:#93c5fd;font-weight:900;display:block}.final b{font-size:5.1pt;display:block;margin-top:.5mm}.footer{position:relative;z-index:1;margin-top:1mm;padding:1.1mm 1mm 0;border-top:1px solid #325477;color:#8fb3d6;font-size:3.6pt;display:flex;justify-content:space-between}.footer .slogan{color:#ff8a3d;font-weight:900;font-style:italic}.gym{width:100%;border-collapse:collapse;background:#fff}.gym th{font-size:3pt;text-transform:uppercase;color:#5b7088;background:#eaf1f7;padding:.75mm .55mm;border-right:1px solid #d1dce7;text-align:center}.gym th:first-child{text-align:left}.gym td{font-size:4pt;padding:.72mm .55mm;border-top:1px solid #d5e0ea;border-right:1px solid #e1e8ef;text-align:center}.gym td:first-child{text-align:left;font-weight:900;width:34mm}.gym td:last-child{text-align:left;width:47mm;color:#6b7f95}.thumb{width:7mm;height:5mm;border-radius:.6mm;background:#eaf0f6;border:1px solid #cad7e4;display:inline-flex;align-items:center;justify-content:center;margin-right:1mm;vertical-align:middle;overflow:hidden}.thumb svg{width:100%;height:100%}.pse{color:#f97316;font-weight:950}
@media print{body{background:#fff}.page{margin:0}}
</style></head><body>
<script>
const fieldSvg=(kind='rondo')=>`<svg viewBox="0 0 100 60" xmlns="http://www.w3.org/2000/svg"><rect width="100" height="60" fill="#157a32"/><g stroke="#fff" stroke-width="1" fill="none" opacity=".8"><rect x="3" y="3" width="94" height="54"/><line x1="50" y1="3" x2="50" y2="57"/><circle cx="50" cy="30" r="8"/></g>${kind==='finish'?'<circle cx="72" cy="30" r="4" fill="#facc15"/><circle cx="56" cy="18" r="4" fill="#2563eb"/><circle cx="57" cy="42" r="4" fill="#2563eb"/><path d="M58 18 Q68 20 71 28" stroke="#fff" stroke-width="1.6" fill="none"/>':'<circle cx="30" cy="18" r="4" fill="#2563eb"/><circle cx="45" cy="15" r="4" fill="#facc15"/><circle cx="65" cy="23" r="4" fill="#2563eb"/><circle cx="38" cy="42" r="4" fill="#2563eb"/><circle cx="62" cy="43" r="4" fill="#facc15"/>'}</svg>`;
const gymSvg=(phase=1)=>`<svg viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><rect width="60" height="60" fill="#f8fafc"/><circle cx="30" cy="10" r="5" fill="#111827"/><path d="M30 15 L${phase===1?26:34} 34 M${phase===1?26:34} 22 L18 30 M${phase===1?26:34} 22 L43 30 M${phase===1?26:34} 34 L20 52 M${phase===1?26:34} 34 L42 52" stroke="#111827" stroke-width="5" stroke-linecap="round" fill="none"/><rect x="13" y="28" width="34" height="5" rx="2" fill="#f97316"/></svg>`;
</script>
<script>
const pic=(svg)=>`<div class="pic">${svg}</div>`;
const metrics=(a,b,c,d,e,f,flabel='ESPAÇO / MIN')=>`<div class="pres"><div><small>SÉRIES</small><b>${a}</b></div><div><small>REPS / TEMPO</small><b>${b}</b></div><div><small>CADÊNCIA</small><b>${c}</b></div><div><small>DESCANSO</small><b>${d}</b></div><div><small>PSE</small><b>${e}</b></div><div><small>${flabel}</small><b>${f}</b></div></div>`;
const ex=(name,sub,svg1,svg2,m,tips)=>`<div class="ex"><div class="title"><b>${name}</b><small>${sub}</small></div><div class="media">${pic(svg1)}${pic(svg2)}</div>${m}<div class="tips"><small>DICAS DE EXECUÇÃO / CORREÇÕES</small><p>${tips}</p></div></div>`;
const block=(n,name,min,html)=>`<div class="block"><div class="blockhead"><i>${n}</i><b>${name}</b><small>${min} min</small></div>${html}</div>`;
const seq=(arr)=>`<div class="sequence">${arr.map((x,i)=>`<div class="step"><i>${i+1}</i><b>${x}</b></div>`).join('')}</div>`;
const check=(stats)=>`<aside class="check"><h3>CHECK-IN</h3>${stats.map(([a,b])=>`<div class="stat"><small>${a}</small><b>${b}</b></div>`).join('')}<div class="values"><span>◒ SONO</span><span>◎ DISPOSIÇÃO</span><span>△ DOR</span><span>◉ ESTRESSE</span><span>◇ HIDRATAÇÃO</span><span>○ CONDIÇÃO GERAL</span></div></aside>`;
const header=(type,subtitle,category)=>`<div class="header"><div class="brand"><div class="logo">AC</div><div><div class="kicker">AC SOCCER · PROCOACH PERFORMANCE</div><h1>FICHA DE TREINO <span>${type}</span></h1><p>${subtitle}</p></div></div><div class="date"><small>DATA DO TREINO</small><b>14/09/2026</b><span>${category}</span><div class="motto">PLANEJAMENTO<br>EVOLUÇÃO<br>PERFORMANCE<br>RESULTADOS</div></div></div>`;
const meta=(athlete,cat,local,obj,dur,pse)=>`<div class="meta"><div><small>EQUIPE / ATLETA</small><b>${athlete}</b></div><div><small>CATEGORIA</small><b>${cat}</b></div><div><small>LOCAL / INÍCIO</small><b>${local}</b></div><div><small>OBJETIVO</small><b>${obj}</b></div><div><small>DURAÇÃO</small><b>${dur}</b></div><div><small>PSE ALVO</small><b>${pse}</b></div></div>`;
const final=(obs)=>`<div class="final"><div><small>PSE FINAL</small><b>____</b></div><div><small>DOR</small><b>____</b></div><div><small>DURAÇÃO REAL</small><b>____ min</b></div><div><small>OBSERVAÇÕES / REGISTRO FINAL</small><b>${obs}</b></div></div>`;
const footer=(type,slogan)=>`<div class="footer"><span>AC Soccer · ProCoach 2.0.6.1</span><span class="slogan">${slogan}</span><span>Ficha Premium · ${type}</span></div>`;

const campo=`<div class="page"><div class="sheet">
${header('CAMPO','DISCIPLINA HOJE. EVOLUÇÃO SEMPRE.','Profissional')}
${meta('Equipe Principal','Profissional','Campo 1 · 09:00','Organização ofensiva, ritmo de jogo e tomada de decisão','90 min','6-8')}
${seq(['Ativação','Técnico / Tático','Posse','Finalização','Condicionamento','Recuperação'])}
<div class="body">${check([['PSQ','20/22'],['PRONTIDÃO','78%'],['DOR ≥ 3','2'],['LIMITADOS','1']])}<main class="main">
${block(1,'ATIVAÇÃO / AQUECIMENTO',12,ex('Mobilidade dinâmica','Preparação geral',gymSvg(1),gymSvg(2),metrics('2','10','Controlada','30 s','3','12 min'),'Amplitude completa; controle do movimento; respiração fluida.'))}
${block(2,'TÉCNICO / TÁTICO',18,ex('Rondo 5 x 2','Posse orientada',fieldSvg('rondo'),fieldSvg('rondo'),metrics('4','2 min','Contínua','1 min','5','18 min'),'Toque rápido; comunicação; apoio constante e ocupação dos espaços.'))}
${block(3,'POSSE / ESPAÇO REDUZIDO',20,ex('Posse 6 x 6 + 2','Jogo posicional',fieldSvg('rondo'),fieldSvg('rondo'),metrics('4','4 min','Contínua','2 min','6','30x25 m'),'Apoio por trás da bola; terceiro homem; reação imediata à perda.'))}
${block(4,'FINALIZAÇÃO',15,ex('Finalização após cruzamento','Último terço',fieldSvg('finish'),fieldSvg('finish'),metrics('4','8','Explosiva','1 min','7','15 min'),'Atacar a zona; orientar o corpo; finalizar com precisão e continuidade.'))}
${block(5,'CONDICIONAMENTO',20,ex('Jogo reduzido 7 x 7','Intensidade competitiva',fieldSvg('rondo'),fieldSvg('rondo'),metrics('2','8 min','Jogo real','3 min','7-8','45x35 m'),'Intensidade alta; tomada de decisão; transições rápidas e compactação.'))}
${block(6,'RECUPERAÇÃO',5,ex('Volta à calma + mobilidade','Recovery',gymSvg(1),gymSvg(2),metrics('1','5 min','Leve','-','2','5 min'),'Respiração controlada; baixar intensidade e recuperar amplitude.'))}
</main></div>${final('Boa sessão. Registrar PSE, dor e duração real ao final.')}${footer('Campo','Futebol é processo.')}</div></div>`;

const gymRows=[
['Extensora','4','12','2-1-2','60 s','6','Alvo','Movimento controlado'],['Leg Press','4','12','2-1-2','60 s','6','Alvo','Pés na largura dos ombros'],['Agachamento curto','4','10','2-1-2','60 s','7','Alvo','Amplitude segura'],['Abdutora','3','15','2-1-2','45 s','6','Alvo','Controle o movimento'],['Panturrilha','4','15','2-1-2','45 s','6','Alvo','Pausa no pico'],['Supino reto','4','10','2-1-2','60 s','7','Alvo','Controle a trajetória'],['Supino inclinado','4','10','2-1-2','60 s','7','Alvo','Movimento completo'],['Peck Deck','3','12','2-1-2','45 s','6','Alvo','Controle escapular'],['Tríceps corda','3','12','2-1-2','45 s','6','Alvo','Extensão completa'],['Tríceps barra','3','12','2-1-2','45 s','6','Alvo','Controle a descida']
];
const gymTable=`<table class="gym"><thead><tr><th>Exercício</th><th>Séries</th><th>Reps</th><th>Cadência</th><th>Desc.</th><th>PSE</th><th>Carga</th><th>Dicas de execução</th></tr></thead><tbody>${gymRows.map(r=>`<tr><td><span class="thumb">${gymSvg(1)}</span>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4]}</td><td class="pse">${r[5]}</td><td>${r[6]}</td><td>${r[7]}</td></tr>`).join('')}</tbody></table>`;
const academia=`<div class="page"><div class="sheet">
${header('ACADEMIA','CORPO FORTE. MENTE PREPARADA.','Plano individual')}
${meta('Adriano','Profissional','Academia · 09:00','Força, estabilidade, prevenção e corrida leve','80 min','5-7')}
${seq(['Mobilidade','Core','Mini Band','Musculação','Cardio','Recuperação'])}
<div class="body">${check([['PRONTIDÃO','82%'],['DOR','1/5'],['DISPOSIÇÃO','4/5'],['STATUS','OK']])}<main class="main">
${block(1,'MOBILIDADE',8,ex('Mobilidade quadril / tornozelo','Preparação',gymSvg(1),gymSvg(2),metrics('2','8/lado','Controlada','20 s','3','-','CARGA'),'Amplitude confortável; tronco estável; respiração controlada.'))}
${block(2,'CORE / ABDOMINAIS / RODA',10,ex('Roda abdominal','Core',gymSvg(1),gymSvg(2),metrics('3','10','Controlada','45 s','5','PC','CARGA'),'Manter quadril alinhado, abdômen ativo e retorno controlado.'))}
${block(3,'MINI BAND',8,ex('Caminhada lateral / Monster Walk','Ativação glútea',gymSvg(1),gymSvg(2),metrics('2','12','2-1-2','30 s','4','Band','CARGA'),'Joelhos alinhados; tensão constante; passos curtos e controlados.'))}
<div class="block"><div class="blockhead"><i>4</i><b>MUSCULAÇÃO</b><small>42 min</small></div>${gymTable}</div>
${block(5,'CARDIO',12,ex('Corrida leve · 4 km','Finalização aeróbia',gymSvg(1),gymSvg(2),metrics('1','4 km','Leve','-','3-4','-','CARGA'),'Ritmo confortável; postura relaxada; respiração controlada.'))}
${block(6,'RECUPERAÇÃO',5,ex('Mobilidade leve + hidratação','Recovery',gymSvg(1),gymSvg(2),metrics('1','5 min','Leve','-','2','-','CARGA'),'Respiração, hidratação e observação de dor/desconforto.'))}
</main></div>${final('Treino concluído conforme o planejado. Registrar cargas realizadas.')}${footer('Academia','Disciplina gera resultado.')}</div></div>`;
document.body.insertAdjacentHTML('beforeend',campo+academia);
</script></body></html>
