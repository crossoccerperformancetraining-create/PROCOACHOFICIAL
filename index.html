};

    const scale = size / 2.5; const center = size / 2; const d = data || { r:0, g:0, p:0, a:0 };
    const pts = [d.r, d.g, d.p, d.a].map((val, i) => `${center + Math.cos((Math.PI / 2) * i - Math.PI / 2) * (val * scale)},${center + Math.sin((Math.PI / 2) * i - Math.PI / 2) * (val * scale)}`);

    const handleExport = () => { const data = {}; for (let i = 0; i < localStorage.length; i++) { const key = localStorage.key(i); if (key.startsWith('pc_')) data[key] = localStorage.getItem(key); } const blob = new Blob([JSON.stringify(data)], {type: 'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `procoach_backup_${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); };
    const handleImport = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { try { const data = JSON.parse(ev.target.result); Object.keys(data).forEach(k => localStorage.setItem(k, data[k])); alert("Restaurado!"); window.location.reload(); } catch (err) { alert("Erro ao ler backup."); } }; reader.readAsText(file); };
    return ( <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm no-print" onClick={onClose}><div className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden" onClick={e=>e.stopPropagation()}><div className="p-4 text-white flex justify-between items-center" style={{backgroundColor: themeColor}}><h3 className="font-bold flex items-center gap-2 text-sm"><Icon name="settings"/> CONFIGURAÇÕES</h3><button onClick={onClose}><Icon name="x"/></button></div><div className="p-6"><h4 className="font-bold text-slate-700 mb-3 text-sm uppercase">Identidade da Equipe</h4><input className="w-full border rounded p-2 text-xs mb-3 font-bold" placeholder="Nome da Equipe" value={teamName||''} onChange={e=>setTeamName(e.target.value)} /><input className="w-full border rounded p-2 text-xs mb-4" placeholder="URL do Escudo (Imagem)" value={teamLogo||''} onChange={e=>setTeamLogo(e.target.value)} /><h4 className="font-bold text-slate-700 mb-3 text-sm uppercase">Cor Principal</h4><div className="flex gap-3 justify-center flex-wrap mb-6">{themeColors.map(color => ( <div key={color} className={`color-picker-swatch ${themeColor === color ? 'active' : ''}`} style={{backgroundColor: color}} onClick={() => setThemeColor(color)}></div> ))}</div><div className="border-t pt-4 flex flex-col gap-2"><button onClick={handleExport} className="w-full bg-blue-50 text-blue-700 border-blue-200 border py-2 rounded text-xs font-bold flex items-center justify-center gap-2 hover:bg-blue-100 transition-colors"><Icon name="download"/> BAIXAR BACKUP</button><div className="relative"><input type="file" id="importFile" accept=".json" onChange={handleImport} className="hidden" /><label htmlFor="importFile" className="w-full bg-green-50 text-green-700 border-green-200 border py-2 rounded text-xs font-bold flex items-center justify-center gap-2 cursor-pointer hover:bg-green-100 transition-colors"><Icon name="upload"/> RESTAURAR BACKUP</label></div></div></div></div></div> );
};

const SeasonStatsModal = ({ show, onClose, stats, setStats, themeColor }) => {
    if (!show) return null;
    const updateStat = (t, f, v) => { const n = { ...stats }; n[t][f] = parseInt(v) || 0; setStats(n); };
    const updateMeta = (field,value) => setStats({...stats,[field]:field==='position'?(parseInt(value)||0):value});
    const calc = (p, w, d) => (!p ? 0 : (((w*3)+d)/(p*3)*100).toFixed(1));
    const t = { p: stats.league.p+stats.cup.p+stats.friendly.p, w: stats.league.w+stats.cup.w+stats.friendly.w, d: stats.league.d+stats.cup.d+stats.friendly.d, l: stats.league.l+stats.cup.l+stats.friendly.l, gf: stats.league.gf+stats.cup.gf+stats.friendly.gf, ga: stats.league.ga+stats.cup.ga+stats.friendly.ga };
    return ( <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={onClose}><div className="bg-white rounded-xl w-full max-w-3xl overflow-hidden" onClick={e=>e.stopPropagation()}><div className="p-4 text-white flex justify-between items-center" style={{backgroundColor: themeColor}}><h3 className="font-bold flex items-center gap-2"><Icon name="chart"/> ESTATÍSTICAS</h3><button onClick={onClose}><Icon name="x"/></button></div><div className="p-4"><div className="grid grid-cols-1 md:grid-cols-[130px_1fr] gap-3 mb-4"><div><label className="report-section-title">Posição atual na liga</label><input type="number" min="1" className="modern-input mt-1" value={stats.position||''} onChange={e=>updateMeta('position',e.target.value)} placeholder="Ex.: 3"/></div><div><label className="report-section-title">Contexto da equipe</label><input className="modern-input mt-1" value={stats.contextNote||''} onChange={e=>updateMeta('contextNote',e.target.value)} placeholder="Ex.: troca de treinador, sequência de viagens, retorno de atletas..."/></div></div><div className="overflow-x-auto"><table className="w-full text-center text-xs"><thead className="font-bold uppercase text-slate-500 bg-slate-100"><tr><th className="p-2 text-left">Competição</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th><th>%</th></tr></thead><tbody>{['league', 'cup', 'friendly'].map(k => { const s = stats[k]; const sg = s.gf-s.ga; return ( <tr key={k} className="border-b"><td className="p-2 text-left font-bold uppercase">{k}</td><td className="p-1"><input type="number" className="w-10 text-center border rounded" value={s.p} onChange={e=>updateStat(k,'p',e.target.value)}/></td><td className="p-1"><input type="number" className="w-10 text-center border rounded bg-green-50" value={s.w} onChange={e=>updateStat(k,'w',e.target.value)}/></td><td className="p-1"><input type="number" className="w-10 text-center border rounded bg-gray-50" value={s.d} onChange={e=>updateStat(k,'d',e.target.value)}/></td><td className="p-1"><input type="number" className="w-10 text-center border rounded bg-red-50" value={s.l} onChange={e=>updateStat(k,'l',e.target.value)}/></td><td className="p-1"><input type="number" className="w-10 text-center border rounded" value={s.gf} onChange={e=>updateStat(k,'gf',e.target.value)}/></td><td className="p-1"><input type="number" className="w-10 text-center border rounded" value={s.ga} onChange={e=>updateStat(k,'ga',e.target.value)}/></td><td className={`p-1 font-bold ${sg>0?'text-green-600':sg<0?'text-red-600':''}`}>{sg}</td><td className="p-1 font-black">{calc(s.p,s.w,s.d)}%</td></tr> ) })}<tr className="bg-slate-50 font-black"><td className="p-3 text-left">TOTAL</td><td>{t.p}</td><td className="text-green-600">{t.w}</td><td>{t.d}</td><td className="text-red-600">{t.l}</td><td>{t.gf}</td><td>{t.ga}</td><td>{t.gf-t.ga}</td><td>{calc(t.p,t.w,t.d)}%</td></tr></tbody></table></div></div></div></div> );
};

const AnalysisModal = ({ show, onClose, themeColor, players, history, currentDate }) => {
    if (!show) return null; const sessionData = (history && history[currentDate]) || { ratings: {} }; const r = sessionData.ratings || {}; const sp = ensureArray(players);
    const ranked = Object.entries(r).map(([idx, rate]) => ({ ...(sp[idx]||{name:'-'}), rate, idx })).filter(p => p.rate > 0).sort((a, b) => b.rate - a.rate);
    const t5 = ranked.slice(0, 5); const b5 = [...ranked].sort((a,b)=>a.rate-b.rate).slice(0,5);
    return ( <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={onClose}><div className="bg-white rounded-xl w-full max-w-lg overflow-hidden" onClick={e=>e.stopPropagation()}><div className="p-4 flex justify-between items-center text-white" style={{background: themeColor}}><h3 className="font-bold flex items-center gap-2"><Icon name="chart"/> Análise ({formatDateBR(currentDate)})</h3><button onClick={onClose}><Icon name="x"/></button></div><div className="p-4 grid grid-cols-2 gap-4"><div className="bg-green-50 rounded-xl p-3 border border-green-100"><h4 className="font-black text-green-700 uppercase text-xs mb-2 flex items-center gap-1"><Icon name="trend"/> TOP 5</h4>{t5.length>0?t5.map((p,i)=>(<div key={i} className="flex justify-between items-center border-b border-green-200 py-1"><span className="text-xs font-bold text-slate-700 truncate w-24">{i+1}. {p.name}</span><div className="flex gap-1 items-center bg-white px-1.5 rounded shadow-sm"><span className="font-black text-green-600 text-xs">{p.rate}</span><Icon name="star" size={10} className="text-yellow-400 drop-shadow-sm"/></div></div>)):<span className="text-xs text-slate-400 italic">Vazio</span>}</div><div className="bg-red-50 rounded-xl p-3 border border-red-100"><h4 className="font-black text-red-700 uppercase text-xs mb-2 flex items-center gap-1"><Icon name="trend" className="rotate-180"/> BOTTOM 5</h4>{b5.length>0?b5.map((p,i)=>(<div key={i} className="flex justify-between items-center border-b border-red-200 py-1"><span className="text-xs font-bold text-slate-700 truncate w-24">{i+1}. {p.name}</span><div className="flex gap-1 items-center bg-white px-1.5 rounded shadow-sm"><span className="font-black text-red-600 text-xs">{p.rate}</span><Icon name="star" size={10} className="text-yellow-400 drop-shadow-sm"/></div></div>)):<span className="text-xs text-slate-400 italic">Vazio</span>}</div></div></div></div> );
};

const DashboardView = ({ themeColor, players, matchHistory, history, setTab, teamLogo, teamName, scoutingData, microData, calendarData, header, seasonStats, openStats, notices, setNotices }) => {
    const sp=ensureArray(players); const now=new Date(); const today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`; const wDay=['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'][now.getDay()];
    const weekStart=new Date(now);weekStart.setHours(0,0,0,0);weekStart.setDate(weekStart.getDate()-((weekStart.getDay()+6)%7));const weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+7);
    const performance=useMemo(()=>{const stats=sp.map(()=>({sum:0,count:0,avg:0}));Object.entries(history||{}).forEach(([date,data])=>{const current=new Date(`${date}T12:00:00`);if(current<weekStart||current>=weekEnd)return;Object.entries(data?.ratings||{}).forEach(([idx,value])=>{const rating=Number(value);if(stats[idx]&&rating>=0&&rating<=5){stats[idx].sum+=rating;stats[idx].count+=1;}});});return sp.map((player,idx)=>{const stat=stats[idx];return {...player,idx,count:stat.count,avg:stat.count?Number((stat.sum/stat.count).toFixed(1)):0};}).filter(player=>player.count>0);},[players,history]);
    const topFive=[...performance].sort((a,b)=>b.avg-a.avg||b.count-a.count).slice(0,5); const lowFive=[...performance].sort((a,b)=>a.avg-b.avg||b.count-a.count).slice(0,5); const injured=sp.filter(p=>p.injured); const suspended=sp.filter(p=>p.suspended); const available=sp.filter(p=>!p.injured&&!p.suspended);
    const dayPlan=microData?.[wDay]||{}; const planMinutes=ensureArray(dayPlan.exercises).reduce((sum,item)=>sum+(parseInt(item.time)||0),0); const agenda=[...(dayPlan.date===today?[{label:dayPlan.sessionTitle||'Sessão de treino',time:header.time||'Treino',detail:`${ensureArray(dayPlan.exercises).length} exercícios · ${planMinutes||0} min`,kind:'session'}]:[]),...ensureArray(dayPlan.blocks).map(item=>({label:item.label,time:item.period==='M'?'Manhã':'Tarde',detail:'Microciclo',kind:'block',color:item.color})),...ensureArray(calendarData?.[today]).map(item=>({label:item.label||item.text||'Compromisso',time:item.period==='M'?'Manhã':'Tarde',detail:'Calendário',kind:'calendar',color:item.color}))];
    const recent=ensureArray(matchHistory).filter(match=>match.date).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5).map(match=>{const us=Number(match.gUs)||0,them=Number(match.gTh)||0;return {...match,result:us>them?'V':us<them?'D':'E'};}); const wins=recent.filter(x=>x.result==='V').length,losses=recent.filter(x=>x.result==='D').length,draws=recent.filter(x=>x.result==='E').length;
    const moment=recent.length===0?'Registre os jogos para gerar a leitura do momento da equipe.':wins>=4?`Excelente momento: ${wins} vitórias nos últimos ${recent.length} jogos.`:losses>=3?`Sinal de atenção: ${losses} derrotas nos últimos ${recent.length} jogos.`:wins>losses?`Evolução positiva: ${wins} vitórias, ${draws} empates e ${losses} derrotas.`:wins===losses?'Momento equilibrado. O próximo jogo pode mudar a tendência.':`Oscilação recente: priorize confiança e consistência competitiva.`;
    const league=seasonStats?.league||{}; const points=(Number(league.w)||0)*3+(Number(league.d)||0); const efficiency=league.p?Math.round((points/(Number(league.p)*3))*100):0; const [nTxt,setNText]=useState(''); const [nDat,setNDate]=useState(today); const addN=()=>{if(nTxt.trim()){setNotices([{id:Date.now(),date:nDat,text:nTxt.trim()},...ensureArray(notices)]);setNText('');}};
    const RankChart=({items,tone='blue',empty})=><div className="space-y-2">{items.length?items.map((player,index)=><div key={player.idx} className="grid grid-cols-[24px_32px_1fr_38px] gap-2 items-center"><span className={`w-6 h-6 rounded-lg flex items-center justify-center text-[10px] font-black ${tone==='red'?'bg-red-50 text-red-600':'bg-blue-50 text-blue-700'}`}>{index+1}</span><div className="w-8 h-8 rounded-full bg-slate-100 border overflow-hidden flex items-center justify-center">{player.image?<img src={player.image} className="w-full h-full object-cover"/>:<Icon name="users" size={12}/>}</div><div className="min-w-0"><div className="text-[11px] font-black truncate">{player.name}</div><div className="h-1.5 rounded-full bg-slate-100 mt-1 overflow-hidden"><div className={`h-full rounded-full ${tone==='red'?'bg-red-500':'bg-blue-600'}`} style={{width:`${Math.max(4,player.avg/5*100)}%`}}></div></div><div className="text-[8px] text-slate-400 mt-0.5">{player.count} sessão(ões)</div></div><span className={`text-sm font-black text-right ${tone==='red'?'text-red-600':'text-blue-700'}`}>{player.avg.toFixed(1)}</span></div>):<div className="py-8 text-center text-xs text-slate-400">{empty}</div>}</div>;
    return <div className="h-full overflow-y-auto bg-slate-50 p-4 md:p-6 animate-fade-in"><div className="grid grid-cols-1 xl:grid-cols-12 gap-4">
        <section className="xl:col-span-12 overflow-hidden rounded-3xl text-white shadow-xl relative" style={{background:`linear-gradient(125deg,#07101f 0%,${themeColor} 72%,#2563eb 100%)`}}><div className="absolute -right-20 -top-28 w-80 h-80 rounded-full border border-white/10 shadow-[0_0_0_45px_rgba(255,255,255,.025)]"></div><div className="relative p-5 md:p-6 flex flex-wrap justify-between items-center gap-5"><div className="flex items-center gap-4"><div className="w-16 h-16 rounded-2xl bg-white/10 border border-white/15 flex items-center justify-center overflow-hidden">{teamLogo?<img src={teamLogo} className="w-full h-full object-contain"/>:<Icon name="users" size={28}/>}</div><div><div className="text-[10px] tracking-[.18em] uppercase text-blue-200 font-bold">Painel executivo · {now.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</div><h2 className="text-2xl md:text-3xl font-black mt-1">{teamName||header.teamName||'Minha equipe'}</h2><div className="text-xs text-white/65 mt-1 max-w-2xl">{moment}</div></div></div><div className="flex flex-wrap gap-2"><button onClick={()=>setTab('session')} className="px-4 py-2.5 rounded-xl bg-white text-slate-900 text-xs font-black flex items-center gap-2"><Icon name="plus" size={15}/> Nova sessão</button><button onClick={()=>setTab('lineup')} className="px-4 py-2.5 rounded-xl bg-white/10 border border-white/15 text-xs font-black flex items-center gap-2"><Icon name="shirt" size={15}/> Escalação</button><button onClick={openStats} className="px-4 py-2.5 rounded-xl bg-white/10 border border-white/15 text-xs font-black flex items-center gap-2"><Icon name="chart" size={15}/> Temporada</button></div></div></section>
        <section className="xl:col-span-12 grid grid-cols-2 lg:grid-cols-4 gap-3"><button onClick={()=>setTab('squad')} className="modern-card p-4 text-left border-l-4 border-l-emerald-500"><div className="report-section-title">Disponíveis para a sessão</div><div className="flex items-end justify-between mt-2"><span className="text-3xl font-black text-emerald-600">{available.length}</span><span className="status-chip bg-emerald-50 text-emerald-700">de {sp.length}</span></div></button><button onClick={()=>setTab('medical')} className="modern-card p-4 text-left border-l-4 border-l-red-500"><div className="report-section-title">Departamento médico</div><div className="flex items-end justify-between mt-2"><span className="text-3xl font-black text-red-600">{injured.length}</span><span className="text-[10px] text-slate-400 font-bold truncate max-w-32">{injured.map(p=>p.name).join(', ')||'Sem atletas'}</span></div></button><button onClick={()=>setTab('squad')} className="modern-card p-4 text-left border-l-4 border-l-amber-500"><div className="report-section-title">Suspensos</div><div className="flex items-end justify-between mt-2"><span className="text-3xl font-black text-amber-600">{suspended.length}</span><span className="text-[10px] text-slate-400 font-bold truncate max-w-32">{suspended.map(p=>p.name).join(', ')||'Sem atletas'}</span></div></button><button onClick={openStats} className="modern-card p-4 text-left border-l-4 border-l-blue-500"><div className="report-section-title">Liga · posição e pontos</div><div className="flex items-end justify-between mt-2"><span className="text-3xl font-black text-blue-700">{seasonStats?.position?`${seasonStats.position}º`:'-'}</span><span className="status-chip bg-blue-50 text-blue-700">{points} pts · {efficiency}%</span></div></button></section>
        <section className="modern-card p-5 xl:col-span-4"><div className="flex justify-between items-start mb-4"><div><div className="report-section-title">Agenda do dia</div><h3 className="text-lg font-black">Compromissos e treino</h3></div><button onClick={()=>setTab('calendar')} className="text-blue-600"><Icon name="calendar"/></button></div><div className="space-y-2">{agenda.length?agenda.slice(0,6).map((item,index)=><div key={index} className="flex gap-3 items-center border rounded-xl p-3 bg-slate-50"><div className={`w-2 h-10 rounded-full ${item.kind==='session'?'bg-blue-600':item.kind==='calendar'?'bg-amber-500':'bg-emerald-500'}`}></div><div className="flex-1 min-w-0"><div className="text-xs font-black truncate">{item.label}</div><div className="text-[9px] text-slate-400 font-bold">{item.detail}</div></div><span className="text-[10px] text-slate-500 font-black">{item.time}</span></div>):<div className="border-2 border-dashed rounded-2xl py-10 text-center"><Icon name="calendar" className="mx-auto text-slate-300"/><div className="text-xs text-slate-400 mt-2">Nenhum compromisso cadastrado hoje.</div><button onClick={()=>setTab('session')} className="text-[10px] font-black text-blue-600 mt-2">CRIAR SESSÃO</button></div>}</div></section>
        <section className="modern-card p-5 xl:col-span-4"><div className="flex justify-between items-start mb-4"><div><div className="report-section-title">Top 5 da semana</div><h3 className="text-lg font-black">Melhores no treinamento</h3></div><span className="status-chip bg-blue-50 text-blue-700">0-5 estrelas</span></div><RankChart items={topFive} empty="Avalie os atletas nas sessões para gerar o ranking."/><button onClick={()=>setTab('performance')} className="btn-secondary w-full !min-h-9 mt-4">Ver desempenho completo</button></section>
        <section className="modern-card p-5 xl:col-span-4"><div className="flex justify-between items-start mb-4"><div><div className="report-section-title">Atenção técnica</div><h3 className="text-lg font-black">Menores médias da semana</h3></div><span className="status-chip bg-red-50 text-red-700">Monitorar</span></div><RankChart items={lowFive} tone="red" empty="Ainda não existem avaliações suficientes."/><div className="mt-4 text-[10px] text-slate-400">Use como sinal para conversa individual, ajuste de carga ou trabalho complementar.</div></section>
        <section onClick={()=>setTab('scouting')} className="modern-card p-5 xl:col-span-5 cursor-pointer relative overflow-hidden"><div className="absolute -right-10 -bottom-12 opacity-[.04]"><Icon name="whistle" size={150}/></div><div className="report-section-title">Próximo jogo</div>{scoutingData?.opponent?<div className="relative mt-4"><div className="flex items-center justify-center gap-5"><div className="w-16 h-16 rounded-2xl bg-slate-50 border flex items-center justify-center overflow-hidden">{teamLogo?<img src={teamLogo} className="w-full h-full object-contain"/>:<Icon name="users"/>}</div><div className="text-center"><div className="text-[10px] text-slate-400 font-black">{scoutingData.competition||'COMPETIÇÃO'}</div><div className="text-xl font-black my-1">VS</div><div className="text-[10px] text-blue-600 font-black">{scoutingData.date?formatDateBR(scoutingData.date):'DATA A DEFINIR'}</div></div><div className="w-16 h-16 rounded-2xl bg-slate-50 border flex items-center justify-center overflow-hidden">{scoutingData.logo?<img src={scoutingData.logo} className="w-full h-full object-contain"/>:<span className="text-[9px] text-slate-400 font-black">ADVERSÁRIO</span>}</div></div><div className="text-center text-lg font-black mt-3">{scoutingData.opponent}</div><div className="text-center text-xs text-slate-400">{scoutingData.location||'Local a definir'}</div></div>:<div className="py-12 text-center text-slate-400 text-xs">Cadastre o adversário no módulo Pré-jogo.</div>}</section>
        <section className="modern-card p-5 xl:col-span-4"><div className="flex justify-between"><div><div className="report-section-title">Momento da equipe</div><h3 className="text-lg font-black">Forma recente</h3></div><span className="status-chip bg-slate-100 text-slate-600">Últimos 5</span></div><div className="flex gap-2 mt-5">{recent.length?recent.map((match,index)=><div key={index} title={`${match.opponent||'Adversário'} ${match.gUs||0}-${match.gTh||0}`} className={`w-10 h-10 rounded-xl flex items-center justify-center text-white font-black ${match.result==='V'?'bg-emerald-500':match.result==='D'?'bg-red-500':'bg-slate-400'}`}>{match.result}</div>):[0,1,2,3,4].map(i=><div key={i} className="w-10 h-10 rounded-xl bg-slate-100"></div>)}</div><p className="text-xs text-slate-500 mt-4 leading-relaxed">{moment}</p>{seasonStats?.contextNote&&<div className="mt-3 rounded-xl bg-amber-50 border border-amber-100 p-3 text-[10px] text-amber-800 font-bold"><Icon name="alert" size={12} className="inline mr-1"/> {seasonStats.contextNote}</div>}</section>
        <section className="modern-card p-5 xl:col-span-3"><div className="flex justify-between items-start"><div><div className="report-section-title">Quadro rápido</div><h3 className="text-lg font-black">Avisos</h3></div><Icon name="clipboard" className="text-slate-300"/></div><div className="flex gap-2 mt-3"><input type="text" className="modern-input !min-h-9 text-xs" placeholder="Novo aviso..." value={nTxt} onChange={e=>setNText(e.target.value)} onKeyDown={e=>{if(e.key==='Enter')addN();}}/><button onClick={addN} className="btn-primary !min-h-9 !px-3"><Icon name="plus" size={14}/></button></div><div className="mt-3 space-y-2 max-h-36 overflow-y-auto">{ensureArray(notices).slice(0,4).map(note=><div key={note.id} className="flex gap-2 border-b pb-2"><div className="flex-1"><div className="text-[9px] text-slate-400 font-bold">{formatDateBR(note.date)}</div><div className="text-[11px] font-bold">{note.text}</div></div><button onClick={()=>setNotices(ensureArray(notices).filter(x=>x.id!==note.id))} className="text-slate-300 hover:text-red-500"><Icon name="trash" size={12}/></button></div>)}{!ensureArray(notices).length&&<div className="text-xs text-slate-400 text-center py-6">Sem avisos.</div>}</div></section>

            {t && <div className="fixed top-20 left-1/2 -translate-x-1/2 bg-green-500 text-white px-6 py-3 rounded-full font-bold text-xs shadow-lg z-50 flex items-center gap-2 no-print"><Icon name="check"/> {t}</div>}
            <AnalysisModal show={sA} onClose={()=>setSA(false)} themeColor={themeColor} players={players} history={history} currentDate={sessionDate} />

const QRCodeBox = ({ value, size=76 }) => {
    const ref = useRef(null);
    useEffect(() => {
        if (!ref.current) return;
        ref.current.innerHTML = '';
        if (value && window.QRCode) new window.QRCode(ref.current, { text:value, width:size, height:size, colorDark:'#0f172a', colorLight:'#ffffff', correctLevel:window.QRCode.CorrectLevel.M });
    }, [value, size]);
    if (!value) return null;
    return <div className="flex flex-col items-center gap-1"><div ref={ref} className="bg-white p-1 rounded border"></div><span className="text-[8px] font-bold text-slate-400 uppercase">Vídeo</span></div>;
};

const SignaturePad = ({ value, onChange, label='Assinatura do treinador' }) => {
    const canvasRef = useRef(null); const drawing = useRef(false);
    useEffect(() => { const c=canvasRef.current; if(!c||!value)return; const img=new Image(); img.onload=()=>{const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);}; img.src=value; }, []);
    const point = (e) => { const c=canvasRef.current, r=c.getBoundingClientRect(), p=e.touches?e.touches[0]:e; return {x:(p.clientX-r.left)*(c.width/r.width),y:(p.clientY-r.top)*(c.height/r.height)}; };
    const start = (e) => { drawing.current=true; const p=point(e),x=canvasRef.current.getContext('2d');x.beginPath();x.moveTo(p.x,p.y);e.preventDefault(); };
    const move = (e) => { if(!drawing.current)return; const p=point(e),x=canvasRef.current.getContext('2d');x.lineWidth=2.2;x.lineCap='round';x.strokeStyle='#0f172a';x.lineTo(p.x,p.y);x.stroke();e.preventDefault(); };
    const end = () => { if(!drawing.current)return;drawing.current=false;onChange(canvasRef.current.toDataURL('image/png')); };
    const clear = () => { const c=canvasRef.current;c.getContext('2d').clearRect(0,0,c.width,c.height);onChange(''); };
    return <div><div className="flex justify-between items-center mb-1"><label className="report-section-title">{label}</label><button onClick={clear} className="text-[10px] font-bold text-red-500 no-print">Limpar</button></div><canvas ref={canvasRef} width="520" height="130" onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end} onTouchStart={start} onTouchMove={move} onTouchEnd={end} className="w-full h-28 bg-white border border-dashed border-slate-300 rounded-xl touch-none"></canvas></div>;
};

const ModernLineupView = ({ players, history, themeColor }) => {
    const [formations,setFormations]=useSafeStorage('pc_saved_formations_v3',[]); const [system,setSystem]=useState('4-3-3'); const [lineup,setLineup]=useState({}); const [slot,setSlot]=useState(null); const [name,setName]=useState('Formação principal');
    const safe=ensureArray(players); const slots=FORMATION_SLOTS[system]||FORMATION_SLOTS['4-3-3'];
    const weekly=useMemo(()=>{const start=new Date();start.setHours(0,0,0,0);start.setDate(start.getDate()-((start.getDay()+6)%7));const end=new Date(start);end.setDate(end.getDate()+7);const stats=safe.map(()=>({sum:0,count:0,avg:0}));Object.entries(history||{}).forEach(([date,data])=>{const current=new Date(`${date}T12:00:00`);if(current<start||current>=end)return;Object.entries(data?.ratings||{}).forEach(([idx,value])=>{const n=Number(value);if(stats[idx]&&n>=0&&n<=5){stats[idx].sum+=n;stats[idx].count+=1;}});});return stats.map(s=>({...s,avg:s.count?Number((s.sum/s.count).toFixed(1)):0}));},[players,history]);
    const ranked=safe.map((p,i)=>({...p,_index:i,weekly:weekly[i]||{avg:0,count:0}})).sort((a,b)=>b.weekly.avg-a.weekly.avg||b.weekly.count-a.weekly.count||a.name.localeCompare(b.name));
    const leader=ranked.find(p=>p.weekly.count>0);
    const save=()=>{const item={id:Date.now(),name:name||system,system,lineup};setFormations([item,...ensureArray(formations).filter(f=>f.name!==item.name)]);};
    const load=(id)=>{const f=ensureArray(formations).find(x=>String(x.id)===String(id));if(f){setName(f.name);setSystem(f.system);setLineup(f.lineup||{});setSlot(null);}};

};

const ModernSessionView = ({ drills,setDrills,header,setHeader,logo,themeColor,players,history,setHistory,sessionDate,setSessionDate,teamName,syncMicrocycle }) => {
    const record=(history&&history[sessionDate])||{}; const [attendance,setAttendance]=useState(record.attendance||{}); const [rpe,setRpe]=useState(record.rpe||{}); const [ratings,setRatings]=useState(record.ratings||{}); const [actual,setActual]=useState(record.actualDuration||''); const [review,setReview]=useState(record.review||{rating:0,outcomes:'',improvements:'',incidents:''}); const [signature,setSignature]=useState(record.signature||''); const [section,setSection]=useState('plan');
    useEffect(()=>{const r=(history&&history[sessionDate])||{};setDrills(ensureArray(r.drills));setAttendance(r.attendance||{});setRpe(r.rpe||{});setRatings(r.ratings||{});setActual(r.actualDuration||'');setReview(r.review||{rating:0,outcomes:'',improvements:'',incidents:''});setSignature(r.signature||'');},[sessionDate]);
    const safe=ensureArray(players), ds=ensureArray(drills), planned=ds.reduce((a,d)=>a+(parseInt(d.time)||0),0); const scheduledDates=Object.entries(history||{}).filter(([,value])=>ensureArray(value?.drills).length).map(([date,value])=>({date,count:ensureArray(value.drills).length})).sort((a,b)=>b.date.localeCompare(a.date)); const present=safe.filter((_,i)=>(attendance[i]||'Presente')==='Presente').length; const totalLoad=safe.reduce((a,_,i)=>a+((parseInt(rpe[i])||0)*(parseInt(actual)||planned||0)),0); const avgRpe=safe.length?(safe.reduce((a,_,i)=>a+(parseInt(rpe[i])||0),0)/safe.length).toFixed(1):0; const ratedValues=Object.values(ratings).map(Number).filter(v=>v>=0&&v<=5); const athleteRatingAvg=ratedValues.length?(ratedValues.reduce((a,b)=>a+b,0)/ratedValues.length).toFixed(1):'0.0';
    const weeklyRatings=useMemo(()=>{const start=new Date(`${sessionDate}T12:00:00`);start.setDate(start.getDate()-((start.getDay()+6)%7));start.setHours(0,0,0,0);const end=new Date(start);end.setDate(end.getDate()+7);const stats=safe.map(()=>({sum:0,count:0,avg:0}));Object.entries(history||{}).forEach(([date,data])=>{if(date===sessionDate)return;const current=new Date(`${date}T12:00:00`);if(current<start||current>=end)return;Object.entries(data?.ratings||{}).forEach(([idx,value])=>{const n=Number(value);if(stats[idx]&&n>=0&&n<=5){stats[idx].sum+=n;stats[idx].count+=1;}});});Object.entries(ratings||{}).forEach(([idx,value])=>{const n=Number(value);if(stats[idx]&&n>=0&&n<=5){stats[idx].sum+=n;stats[idx].count+=1;}});return stats.map(s=>({...s,avg:s.count?Number((s.sum/s.count).toFixed(1)):0}));},[players,history,ratings,sessionDate]);
    const applyDrills=(next)=>{setDrills(next);if(syncMicrocycle)syncMicrocycle(next);};
    const updateDrill=(i,f,v)=>{const n=[...ds];n[i]={...n[i],[f]:v};applyDrills(n);};
    const updateRating=(i,value)=>{const next={...ratings,[i]:value};setRatings(next);setHistory({...history,[sessionDate]:{...record,drills:ds,header,attendance,rpe,ratings:next,actualDuration:actual,review,signature,updatedAt:new Date().toISOString()}});};
    const save=()=>{setHistory({...history,[sessionDate]:{...record,drills:ds,header,attendance,rpe,ratings,actualDuration:actual,review,signature,updatedAt:new Date().toISOString()}});if(syncMicrocycle)syncMicrocycle(ds);};
    return <div className="h-full overflow-y-auto bg-slate-50 p-4 md:p-6">
        <div className="no-print flex flex-wrap justify-between gap-3 mb-5"><div className="flex gap-2 overflow-x-auto"><button className={`btn-secondary ${section==='plan'?'!bg-slate-900 !text-white':''}`} onClick={()=>setSection('plan')}>Planejamento</button><button className={`btn-secondary ${section==='attendance'?'!bg-slate-900 !text-white':''}`} onClick={()=>setSection('attendance')}>Presença e carga</button><button className={`btn-secondary ${section==='ratings'?'!bg-slate-900 !text-white':''}`} onClick={()=>setSection('ratings')}><Icon name="star" size={14}/> Avaliação individual</button><button className={`btn-secondary ${section==='review'?'!bg-slate-900 !text-white':''}`} onClick={()=>setSection('review')}>Pós-treino</button></div><div className="flex flex-wrap gap-2"><select className="modern-input min-w-52" value={scheduledDates.some(item=>item.date===sessionDate)?sessionDate:''} onChange={e=>e.target.value&&setSessionDate(e.target.value)}><option value="">Buscar sessão por data...</option>{scheduledDates.map(item=><option key={item.date} value={item.date}>{formatDateBR(item.date)} · {item.count} exercício(s)</option>)}</select><input type="date" className="modern-input w-auto" value={sessionDate} onChange={e=>setSessionDate(e.target.value)}/><button className="btn-secondary" onClick={()=>printDocument('technical')}><Icon name="pdf"/> Ficha técnica</button><button className="btn-secondary" onClick={()=>printDocument('executive')}><Icon name="chart"/> Executivo</button><button className="btn-primary" onClick={save}><Icon name="save"/> Salvar</button></div></div>

            <div className={`${section==='plan'?'grid':'hidden'} no-print grid-cols-1 xl:grid-cols-[minmax(0,1fr)_340px] gap-5 mb-5`}><div className="grid grid-cols-1 gap-5 content-start">{ds.map((d,i)=><div key={d.id||i} className="modern-card overflow-hidden"><div className="p-4 border-b flex gap-3 items-center"><span className="w-9 h-9 rounded-xl text-white flex items-center justify-center font-black" style={{background:themeColor}}>{i+1}</span><input className="font-black text-lg flex-1 outline-none" value={d.name||''} onChange={e=>updateDrill(i,'name',e.target.value)}/><div className="flex items-center gap-1"><input className="w-16 modern-input !min-h-10 !p-1 text-center font-black" value={d.time||''} onChange={e=>updateDrill(i,'time',e.target.value)}/><span className="text-[10px] font-bold text-slate-400">MIN</span></div><button className="text-slate-300 hover:text-red-500" onClick={()=>applyDrills(ds.filter((_,x)=>x!==i))}><Icon name="trash" size={17}/></button></div><div className="grid grid-cols-1 lg:grid-cols-[52%_1fr] min-h-[340px]"><div className="bg-slate-100 flex items-center justify-center overflow-hidden min-h-[280px]">{d.image?<img src={d.image} className="w-full h-full max-h-[420px] object-contain"/>:<div className="text-slate-300 text-center"><Icon name="pitch" size={64}/><div className="text-xs font-bold mt-2">CAMPO DO EXERCÍCIO</div></div>}</div><div className="p-4 space-y-3"><div className="grid grid-cols-2 gap-2"><select className="modern-input !min-h-10 text-xs" value={d.method||'Tático'} onChange={e=>updateDrill(i,'method',e.target.value)}>{activityOptions.map(option=><option key={option}>{option}</option>)}</select><input className="modern-input !min-h-10 text-xs" placeholder="Dimensões: 30x25 m" value={d.dim||''} onChange={e=>updateDrill(i,'dim',e.target.value)}/></div><textarea className="modern-input h-28 text-sm" placeholder="Descrição, organização e regras" value={d.desc||''} onChange={e=>updateDrill(i,'desc',e.target.value)}/><textarea className="modern-input h-24 text-sm" placeholder="Variações e correções do treinador" value={d.variants||''} onChange={e=>updateDrill(i,'variants',e.target.value)}/><div className="grid grid-cols-[1fr_110px] gap-2"><input className="modern-input !min-h-10 text-xs" placeholder="URL do vídeo" value={d.video||''} onChange={e=>updateDrill(i,'video',e.target.value)}/><input className="modern-input !min-h-10 text-xs" placeholder="Séries" value={d.series||''} onChange={e=>updateDrill(i,'series',e.target.value)}/></div></div></div></div>)}</div><aside className="modern-card p-4 h-fit xl:sticky xl:top-0"><div className="flex justify-between items-center mb-3"><div><div className="report-section-title">Atletas da sessão</div><h3 className="font-black">Nota individual</h3></div><div className="text-right"><div className="text-2xl font-black text-amber-500">{athleteRatingAvg}</div><div className="text-[8px] text-slate-400 font-bold">MÉDIA</div></div></div><p className="text-[10px] text-slate-500 mb-3">Clique de 0 a 5 estrelas. A nota é salva na sessão e entra no desempenho semanal.</p><div className="space-y-2 max-h-[560px] overflow-y-auto pr-1">{safe.map((p,i)=><div key={i} className="border rounded-xl p-2 bg-slate-50"><div className="flex items-center gap-2 mb-2"><div className="w-8 h-8 rounded-full bg-white border overflow-hidden flex items-center justify-center">{p.image?<img src={p.image} className="w-full h-full object-cover"/>:<Icon name="users" size={14}/>}</div><div className="min-w-0 flex-1"><div className="text-xs font-black truncate">{p.name}</div><div className="text-[9px] text-slate-400 font-bold">{attendance[i]||'Presente'} · {Object.prototype.hasOwnProperty.call(ratings,i)?`${ratings[i]}/5`:'Sem nota'}</div></div></div><StarRating value={ratings[i]??0} onChange={value=>updateRating(i,value)} showZero size={18}/></div>)}</div></aside></div>

                        </div>
                    </header>
                    {activeGroup.items.length>1 && <div className="md:hidden flex bg-white border-b px-3 py-2 gap-2 overflow-x-auto no-print shrink-0">{activeGroup.items.map(item => <button key={item.tab} onClick={()=>setTab(item.tab)} className={`shrink-0 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 ${tab===item.tab?'text-white shadow':'bg-slate-100 text-slate-500'}`} style={{backgroundColor:tab===item.tab?themeColor:''}}><Icon name={item.icon} size={14}/>{item.label}</button>)}</div>}

                    <div className="app-content flex-1 overflow-hidden relative">
                {tab === 'dashboard' && <DashboardView themeColor={themeColor} players={playersRaw} matchHistory={matchHistoryRaw} history={sessionHistory} setTab={setTab} teamLogo={teamLogo} teamName={teamName} scoutingData={scoutingData} microData={microData} calendarData={calendarData} header={header} seasonStats={seasonStats} openStats={()=>setShowStatsModal(true)} notices={noticesRaw} setNotices={setNotices} />}
                {tab === 'squad' && <SquadView players={playersRaw} setPlayers={setPlayers} themeColor={themeColor} history={sessionHistory} />}
                {tab === 'lineup' && <ModernLineupView players={playersRaw} history={sessionHistory} themeColor={themeColor} />}
                {tab === 'performance' && <PerformanceView players={playersRaw} history={sessionHistory} themeColor={themeColor} />}
                {tab === 'scouting' && <ScoutingView themeColor={themeColor} scoutingData={scoutingData} setScoutingData={setScoutingData} scoutingHistory={scoutingHistoryRaw} setScoutingHistory={setScoutingHistory} />}
                {tab === 'opponenthistory' && <OpponentHistoryView scoutingData={scoutingData} setScoutingData={setScoutingData} scoutingHistory={scoutingHistoryRaw} matchHistory={matchHistoryRaw} sessionHistory={sessionHistory} teamName={teamName} />}
                {tab === 'session' && <ModernSessionView drills={sessionDrills} setDrills={setSessionDrills} header={header} setHeader={setHeader} logo={teamLogo} themeColor={themeColor} players={playersRaw} history={sessionHistory} setHistory={setSessionHistory} sessionDate={sessionDate} setSessionDate={setSessionDate} teamName={teamName} syncMicrocycle={(drills)=>syncSessionToMicrocycle(drills,sessionDate)} />}
                {tab === 'postmatch' && <ModernMatchReportView themeColor={themeColor} matchData={matchData} setMatchData={setMatchData} players={playersRaw} setPlayers={setPlayers} matchHistory={matchHistoryRaw} setMatchHistory={setMatchHistory} teamLogo={teamLogo} teamName={teamName} />}
                {tab === 'micro' && <MicrocycleView micro={microData} setMicro={setMicroData} themeColor={themeColor} calendar={calendarData} library={libraryDrillsRaw} currentSessionDate={sessionDate} teamName={teamName} teamLogo={teamLogo} onOpenSession={openSessionFromMicrocycle} onAddExercise={addExerciseToMicrocycle} onRemoveExercise={removeExerciseFromMicrocycle} onDateChange={connectMicrocycleDate} onLinkCurrentSession={(day)=>syncSessionToMicrocycle(sessionDrills,sessionDate,day)} />}
                {tab === 'board' && <VisualBoardView currentWeekStart={getMonday(boardWeekDate)} changeWeek={(d)=>{const n=new Date(boardWeekDate); n.setDate(n.getDate()+d); setBoardWeekDate(n);}} boardData={boardHistory[getWeekKey(boardWeekDate)]||{}} updateBoardData={(d,i)=>{const k=getWeekKey(boardWeekDate); setBoardHistory({...boardHistory, [k]:{...(boardHistory[k]||{}), [d]:i}});}} themeColor={themeColor} />}
                {tab === 'calendar' && <CalendarView calendar={calendarData} setCalendar={setCalendarData} themeColor={themeColor} notices={noticesRaw} />}
                {tab === 'library' && <SmartLibraryView lib={libraryDrillsRaw} setLib={setLibraryDrills} onAddS={(item)=>addExerciseToSession(item,sessionDate)} onSchedule={scheduleExercise} tC={themeColor} />}
                {tab === 'tactical' && <TacticalBoardPro />}
                {['wellness','load','medical','contracts','season','player360','communication','portal','roles','reports','assistant','versions'].includes(tab) && <ClubModuleView mode={tab} players={playersRaw} sessionHistory={sessionHistory} teamName={teamName} themeColor={themeColor} />}
                {tab === 'printcenter' && <PrintCenterView teamName={teamName} teamLogo={teamLogo} sessionHistory={sessionHistory} matchHistory={matchHistoryRaw} />}
                    </div>
                </main>
            </div>
            <nav className="mobile-main-nav md:hidden fixed bottom-0 inset-x-0 bg-white border-t shadow-[0_-4px_18px_rgba(15,23,42,0.10)] z-40 flex justify-start overflow-x-auto px-1 pt-1 no-print">
                {navigationGroups.map(group => <button key={group.id} onClick={()=>openGroup(group)} className={`mobile-main-button shrink-0 w-20 rounded-xl flex flex-col items-center justify-center gap-1 text-[9px] font-bold ${activeGroup.id===group.id?'bg-slate-100':'text-slate-400'}`} style={{color:activeGroup.id===group.id?themeColor:''}}><Icon name={group.icon} size={19}/><span className="truncate max-w-[74px]">{group.label}</span></button>)}
            </nav>
        </div>
    );
};

const MainControl = () => {
    const [user, setUser] = useState(null); const [loading, setLoading] = useState(true);
    useEffect(() => {
        const setLoadingProgress=(text,percent)=>{const label=document.getElementById('loading-text'),bar=document.getElementById('loading-progress-bar'),value=document.getElementById('loading-percent');if(label)label.innerText=text;if(bar)bar.style.width=`${percent}%`;if(value)value.innerText=`${percent}%`;};
        const finishLoading=()=>{clearTimeout(window.__pcBootGuard);setLoadingProgress('Painel pronto',100);setTimeout(()=>{setLoading(false);const l=document.getElementById('loading');if(l){l.style.opacity='0';l.style.transition='opacity .25s ease';setTimeout(()=>l.style.display='none',260);}},220);};
        setLoadingProgress('Validando acesso',28);
        if (!auth) { setLoadingProgress('Abrindo dados locais',86); finishLoading(); return; }
        const t = setTimeout(() => { setLoadingProgress('Abrindo no modo local',92); finishLoading(); }, 8000);
        const un = auth.onAuthStateChanged(async (u) => {
            clearTimeout(t);
            if (u && db) {
                try {
                    setLoadingProgress('Sincronizando dados da equipe',58);
                    const doc = await db.collection('coachData').doc(u.uid).get({ source: 'default' });
                    if (doc.exists) {
                        const d = doc.data(); Object.keys(d).forEach(k => { if (k.startsWith('pc_')) { window.localStorage.setItem(k, typeof d[k] === 'string' ? d[k] : JSON.stringify(d[k])); } });
                    }
                    setLoadingProgress('Preparando indicadores',86);
                } catch(e) { setLoadingProgress('Usando dados disponíveis no aparelho',86); }
            }
            setUser(u); finishLoading();
        });
        return () => {clearTimeout(t);un();};
    }, []);

    if (loading) return null;
    if (!user && auth) return <AuthScreen />;
    return <App user={user} />;
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><MainControl /></ErrorBoundary>);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script>
</body>

</html>
