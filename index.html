};

    const scale = size / 2.5; const center = size / 2; const d = data || { r:0, g:0, p:0, a:0 };
    const pts = [d.r, d.g, d.p, d.a].map((val, i) => `${center + Math.cos((Math.PI / 2) * i - Math.PI / 2) * (val * scale)},${center + Math.sin((Math.PI / 2) * i - Math.PI / 2) * (val * scale)}`);

    const handleExport = () => { const data = {}; for (let i = 0; i < localStorage.length; i++) { const key = localStorage.key(i); if (key.startsWith('pc_')) data[key] = localStorage.getItem(key); } const blob = new Blob([JSON.stringify(data)], {type: 'application/json'}); const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = `procoach_backup_${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url); };
    const handleImport = (e) => { const file = e.target.files[0]; if (!file) return; const reader = new FileReader(); reader.onload = (ev) => { try { const data = JSON.parse(ev.target.result); Object.keys(data).forEach(k => localStorage.setItem(k, data[k])); alert("Restaurado!"); window.location.reload(); } catch (err) { alert("Erro ao ler backup."); } }; reader.readAsText(file); };
    return ( <div className="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 backdrop-blur-sm no-print" onClick={onClose}><div className="bg-white rounded-2xl shadow-xl w-full max-w-sm overflow-hidden" onClick={e=>e.stopPropagation()}><div className="p-4 text-white flex justify-between items-center" style={{backgroundColor: themeColor}}><h3 className="font-bold flex items-center gap-2 text-sm"><Icon name="settings"/> CONFIGURAÇÕES</h3><button onClick={onClose}><Icon name="x"/></button></div><div className="p-6"><h4 className="font-bold text-slate-700 mb-3 text-sm uppercase">Identidade da Equipe</h4><input className="w-full border rounded p-2 text-xs mb-3 font-bold" placeholder="Nome da Equipe" value={teamName||''} onChange={e=>setTeamName(e.target.value)} /><input className="w-full border rounded p-2 text-xs mb-4" placeholder="URL do Escudo (Imagem)" value={teamLogo||''} onChange={e=>setTeamLogo(e.target.value)} /><h4 className="font-bold text-slate-700 mb-3 text-sm uppercase">Cor Principal</h4><div className="flex gap-3 justify-center flex-wrap mb-6">{themeColors.map(color => ( <div key={color} className={`color-picker-swatch ${themeColor === color ? 'active' : ''}`} style={{backgroundColor: color}} onClick={() => setThemeColor(color)}></div> ))}</div><div className="border-t pt-4 flex flex-col gap-2"><button onClick={handleExport} className="w-full bg-blue-50 text-blue-700 border-blue-200 border py-2 rounded text-xs font-bold flex items-center justify-center gap-2 hover:bg-blue-100 transition-colors"><Icon name="download"/> BAIXAR BACKUP</button><div className="relative"><input type="file" id="importFile" accept=".json" onChange={handleImport} className="hidden" /><label htmlFor="importFile" className="w-full bg-green-50 text-green-700 border-green-200 border py-2 rounded text-xs font-bold flex items-center justify-center gap-2 cursor-pointer hover:bg-green-100 transition-colors"><Icon name="upload"/> RESTAURAR BACKUP</label></div></div></div></div></div> );
};

const SeasonStatsModal = ({ show, onClose, stats, setStats, themeColor }) => {
    if (!show) return null;
    const updateStat = (t, f, v) => { const n = { ...stats }; n[t][f] = parseInt(v) || 0; setStats(n); };
    const updateMeta = (field,value) => setStats({...stats,[field]:field==='position'?(parseInt(value)||0):value});
    const calc = (p, w, d) => (!p ? 0 : (((w*3)+d)/(p*3)*100).toFixed(1));
    const t = { p: stats.league.p+stats.cup.p+stats.friendly.p, w: stats.league.w+stats.cup.w+stats.friendly.w, d: stats.league.d+stats.cup.d+stats.friendly.d, l: stats.league.l+stats.cup.l+stats.friendly.l, gf: stats.league.gf+stats.cup.gf+stats.friendly.gf, ga: stats.league.ga+stats.cup.ga+stats.friendly.ga };
    return ( <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={onClose}><div className="bg-white rounded-xl w-full max-w-3xl overflow-hidden" onClick={e=>e.stopPropagation()}><div className="p-4 text-white flex justify-between items-center" style={{backgroundColor: themeColor}}><h3 className="font-bold flex items-center gap-2"><Icon name="chart"/> ESTATÍSTICAS</h3><button onClick={onClose}><Icon name="x"/></button></div><div className="p-4"><div className="grid grid-cols-1 md:grid-cols-[130px_1fr] gap-3 mb-4"><div><label className="report-section-title">Posição atual na liga</label><input type="number" min="1" className="modern-input mt-1" value={stats.position||''} onChange={e=>updateMeta('position',e.target.value)} placeholder="Ex.: 3"/></div><div><label className="report-section-title">Contexto da equipe</label><input className="modern-input mt-1" value={stats.contextNote||''} onChange={e=>updateMeta('contextNote',e.target.value)} placeholder="Ex.: troca de treinador, sequência de viagens, retorno de atletas..."/></div></div><div className="overflow-x-auto"><table className="w-full text-center text-xs"><thead className="font-bold uppercase text-slate-500 bg-slate-100"><tr><th className="p-2 text-left">Competição</th><th>J</th><th>V</th><th>E</th><th>D</th><th>GP</th><th>GC</th><th>SG</th><th>%</th></tr></thead><tbody>{['league', 'cup', 'friendly'].map(k => { const s = stats[k]; const sg = s.gf-s.ga; return ( <tr key={k} className="border-b"><td className="p-2 text-left font-bold uppercase">{k}</td><td className="p-1"><input type="number" className="w-10 text-center border rounded" value={s.p} onChange={e=>updateStat(k,'p',e.target.value)}/></td><td className="p-1"><input type="number" className="w-10 text-center border rounded bg-green-50" value={s.w} onChange={e=>updateStat(k,'w',e.target.value)}/></td><td className="p-1"><input type="number" className="w-10 text-center border rounded bg-gray-50" value={s.d} onChange={e=>updateStat(k,'d',e.target.value)}/></td><td className="p-1"><input type="number" className="w-10 text-center border rounded bg-red-50" value={s.l} onChange={e=>updateStat(k,'l',e.target.value)}/></td><td className="p-1"><input type="number" className="w-10 text-center border rounded" value={s.gf} onChange={e=>updateStat(k,'gf',e.target.value)}/></td><td className="p-1"><input type="number" className="w-10 text-center border rounded" value={s.ga} onChange={e=>updateStat(k,'ga',e.target.value)}/></td><td className={`p-1 font-bold ${sg>0?'text-green-600':sg<0?'text-red-600':''}`}>{sg}</td><td className="p-1 font-black">{calc(s.p,s.w,s.d)}%</td></tr> ) })}<tr className="bg-slate-50 font-black"><td className="p-3 text-left">TOTAL</td><td>{t.p}</td><td className="text-green-600">{t.w}</td><td>{t.d}</td><td className="text-red-600">{t.l}</td><td>{t.gf}</td><td>{t.ga}</td><td>{t.gf-t.ga}</td><td>{calc(t.p,t.w,t.d)}%</td></tr></tbody></table></div></div></div></div> );
};

const AnalysisModal = ({ show, onClose, themeColor, players, history, currentDate }) => {
    if (!show) return null; const sessionData = (history && history[currentDate]) || { ratings: {} }; const r = sessionData.ratings || {}; const sp = ensureArray(players);
    const ranked = Object.entries(r).map(([idx, rate]) => ({ ...(sp[idx]||{name:'-'}), rate, idx })).filter(p => p.rate > 0).sort((a, b) => b.rate - a.rate);
    const t5 = ranked.slice(0, 5); const b5 = [...ranked].sort((a,b)=>a.rate-b.rate).slice(0,5);
    return ( <div className="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm" onClick={onClose}><div className="bg-white rounded-xl w-full max-w-lg overflow-hidden" onClick={e=>e.stopPropagation()}><div className="p-4 flex justify-between items-center text-white" style={{background: themeColor}}><h3 className="font-bold flex items-center gap-2"><Icon name="chart"/> Análise ({formatDateBR(currentDate)})</h3><button onClick={onClose}><Icon name="x"/></button></div><div className="p-4 grid grid-cols-2 gap-4"><div className="bg-green-50 rounded-xl p-3 border border-green-100"><h4 className="font-black text-green-700 uppercase text-xs mb-2 flex items-center gap-1"><Icon name="trend"/> TOP 5</h4>{t5.length>0?t5.map((p,i)=>(<div key={i} className="flex justify-between items-center border-b border-green-200 py-1"><span className="text-xs font-bold text-slate-700 truncate w-24">{i+1}. {p.name}</span><div className="flex gap-1 items-center bg-white px-1.5 rounded shadow-sm"><span className="font-black text-green-600 text-xs">{p.rate}</span><Icon name="star" size={10} className="text-yellow-400 drop-shadow-sm"/></div></div>)):<span className="text-xs text-slate-400 italic">Vazio</span>}</div><div className="bg-red-50 rounded-xl p-3 border border-red-100"><h4 className="font-black text-red-700 uppercase text-xs mb-2 flex items-center gap-1"><Icon name="trend" className="rotate-180"/> BOTTOM 5</h4>{b5.length>0?b5.map((p,i)=>(<div key={i} className="flex justify-between items-center border-b border-red-200 py-1"><span className="text-xs font-bold text-slate-700 truncate w-24">{i+1}. {p.name}</span><div className="flex gap-1 items-center bg-white px-1.5 rounded shadow-sm"><span className="font-black text-red-600 text-xs">{p.rate}</span><Icon name="star" size={10} className="text-yellow-400 drop-shadow-sm"/></div></div>)):<span className="text-xs text-slate-400 italic">Vazio</span>}</div></div></div></div> );
};

const DashboardView = ({ themeColor, players, matchHistory, history, setTab, teamLogo, teamName, scoutingData, microData, calendarData, header, seasonStats, openStats, notices, setNotices }) => {
    const sp=ensureArray(players); const now=new Date(); const today=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`; const wDay=['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'][now.getDay()];
    const weekStart=new Date(now);weekStart.setHours(0,0,0,0);weekStart.setDate(weekStart.getDate()-((weekStart.getDay()+6)%7));const weekEnd=new Date(weekStart);weekEnd.setDate(weekEnd.getDate()+7);
    const performance=useMemo(()=>{const stats=sp.map(()=>({sum:0,count:0,avg:0}));Object.entries(history||{}).forEach(([date,data])=>{const current=new Date(`${date}T12:00:00`);if(current<weekStart||current>=weekEnd)return;Object.entries(data?.ratings||{}).forEach(([idx,value])=>{const rating=Number(value);if(stats[idx]&&rating>=0&&rating<=5){stats[idx].sum+=rating;stats[idx].count+=1;}});});return sp.map((player,idx)=>{const stat=stats[idx];return {...player,idx,count:stat.count,avg:stat.count?Number((stat.sum/stat.count).toFixed(1)):0};}).filter(player=>player.count>0);},[players,history]);
    const topFive=[...performance].sort((a,b)=>b.avg-a.avg||b.count-a.count).slice(0,5); const lowFive=[...performance].sort((a,b)=>a.avg-b.avg||b.count-a.count).slice(0,5); const injured=sp.filter(p=>p.injured); const suspended=sp.filter(p=>p.suspended); const available=sp.filter(p=>!p.injured&&!p.suspended);
    const weekRecords=Object.entries(history||{}).filter(([date])=>{const current=new Date(`${date}T12:00:00`);return current>=weekStart&&current<weekEnd;});let weeklyLoad=0,rpeSum=0,rpeCount=0,presentCount=0,attendanceCount=0;weekRecords.forEach(([,record])=>{const duration=Number(record.actualDuration)||ensureArray(record.drills).reduce((sum,item)=>sum+(parseInt(item.time)||0),0);Object.values(record.rpe||{}).forEach(value=>{const rpe=Number(value)||0;rpeSum+=rpe;rpeCount++;weeklyLoad+=rpe*duration;});Object.values(record.attendance||{}).forEach(value=>{attendanceCount++;if(value==='Presente')presentCount++;});});const weeklyAvgRpe=rpeCount?(rpeSum/rpeCount).toFixed(1):'-';const weeklyPresence=attendanceCount?Math.round(presentCount/attendanceCount*100):0;const weeklyVolume=weekRecords.reduce((sum,[,record])=>sum+(Number(record.actualDuration)||ensureArray(record.drills).reduce((value,item)=>value+(parseInt(item.time)||0),0)),0);
    const dayPlan=microData?.[wDay]||{}; const planMinutes=ensureArray(dayPlan.exercises).reduce((sum,item)=>sum+(parseInt(item.time)||0),0); const agenda=[...(dayPlan.date===today?[{label:dayPlan.sessionTitle||'Sessão de treino',time:header.time||'Treino',detail:`${ensureArray(dayPlan.exercises).length} exercícios · ${planMinutes||0} min`,kind:'session'}]:[]),...ensureArray(dayPlan.blocks).map(item=>({label:item.label,time:item.period==='M'?'Manhã':'Tarde',detail:'Microciclo',kind:'block',color:item.color})),...ensureArray(calendarData?.[today]).map(item=>({label:item.label||item.text||'Compromisso',time:item.period==='M'?'Manhã':'Tarde',detail:'Calendário',kind:'calendar',color:item.color}))];
    const recent=ensureArray(matchHistory).filter(match=>match.date).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5).map(match=>{const us=Number(match.gUs)||0,them=Number(match.gTh)||0;return {...match,result:us>them?'V':us<them?'D':'E'};}); const wins=recent.filter(x=>x.result==='V').length,losses=recent.filter(x=>x.result==='D').length,draws=recent.filter(x=>x.result==='E').length;
    const moment=recent.length===0?'Registre os jogos para gerar a leitura do momento da equipe.':wins>=4?`Excelente momento: ${wins} vitórias nos últimos ${recent.length} jogos.`:losses>=3?`Sinal de atenção: ${losses} derrotas nos últimos ${recent.length} jogos.`:wins>losses?`Evolução positiva: ${wins} vitórias, ${draws} empates e ${losses} derrotas.`:wins===losses?'Momento equilibrado. O próximo jogo pode mudar a tendência.':`Oscilação recente: priorize confiança e consistência competitiva.`;
    const league=seasonStats?.league||{}; const points=(Number(league.w)||0)*3+(Number(league.d)||0); const efficiency=league.p?Math.round((points/(Number(league.p)*3))*100):0; const [nTxt,setNText]=useState(''); const [nDat,setNDate]=useState(today); const addN=()=>{if(nTxt.trim()){setNotices([{id:Date.now(),date:nDat,text:nTxt.trim()},...ensureArray(notices)]);setNText('');}};
    const RankChart=({items,tone='blue',empty})=><div className="space-y-2">{items.length?items.map((player,index)=><div key={player.idx} className="grid grid-cols-[24px_32px_1fr_38px] gap-2 items-center"><span className={`w-6 h-6 rounded-lg flex items-center justify-center text-[10px] font-black ${tone==='red'?'bg-red-50 text-red-600':'bg-blue-50 text-blue-700'}`}>{index+1}</span><div className="w-8 h-8 rounded-full bg-slate-100 border overflow-hidden flex items-center justify-center">{player.image?<img src={player.image} className="w-full h-full object-cover"/>:<Icon name="users" size={12}/>}</div><div className="min-w-0"><div className="text-[11px] font-black truncate">{player.name}</div><div className="h-1.5 rounded-full bg-slate-100 mt-1 overflow-hidden"><div className={`h-full rounded-full ${tone==='red'?'bg-red-500':'bg-blue-600'}`} style={{width:`${Math.max(4,player.avg/5*100)}%`}}></div></div><div className="text-[8px] text-slate-400 mt-0.5">{player.count} sessão(ões)</div></div><span className={`text-sm font-black text-right ${tone==='red'?'text-red-600':'text-blue-700'}`}>{player.avg.toFixed(1)}</span></div>):<div className="py-8 text-center text-xs text-slate-400">{empty}</div>}</div>;
    return <div className="h-full overflow-y-auto bg-slate-50 p-4 md:p-6 animate-fade-in"><div className="grid grid-cols-1 xl:grid-cols-12 gap-4">
        <section className="xl:col-span-12 overflow-hidden rounded-3xl text-white shadow-xl relative" style={{background:`linear-gradient(125deg,#07101f 0%,${themeColor} 72%,#2563eb 100%)`}}><div className="absolute -right-20 -top-28 w-80 h-80 rounded-full border border-white/10 shadow-[0_0_0_45px_rgba(255,255,255,.025)]"></div><div className="relative p-5 md:p-6 flex flex-wrap justify-between items-center gap-5"><div className="flex items-center gap-4"><div className="w-16 h-16 rounded-2xl bg-white/10 border border-white/15 flex items-center justify-center overflow-hidden">{teamLogo?<img src={teamLogo} className="w-full h-full object-contain"/>:<Icon name="users" size={28}/>}</div><div><div className="text-[10px] tracking-[.18em] uppercase text-blue-200 font-bold">Painel executivo · {now.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</div><h2 className="text-2xl md:text-3xl font-black mt-1">{teamName||header.teamName||'Minha equipe'}</h2><div className="text-xs text-white/65 mt-1 max-w-2xl">{moment}</div></div></div><div className="flex flex-wrap gap-2"><button onClick={()=>setTab('session')} className="px-4 py-2.5 rounded-xl bg-white text-slate-900 text-xs font-black flex items-center gap-2"><Icon name="plus" size={15}/> Nova sessão</button><button onClick={()=>setTab('lineup')} className="px-4 py-2.5 rounded-xl bg-white/10 border border-white/15 text-xs font-black flex items-center gap-2"><Icon name="shirt" size={15}/> Escalação</button><button onClick={openStats} className="px-4 py-2.5 rounded-xl bg-white/10 border border-white/15 text-xs font-black flex items-center gap-2"><Icon name="chart" size={15}/> Temporada</button></div></div></section>
        <section className="xl:col-span-12 grid grid-cols-2 lg:grid-cols-4 gap-3"><button onClick={()=>setTab('squad')} className="modern-card p-4 text-left border-l-4 border-l-emerald-500"><div className="report-section-title">Disponíveis para a sessão</div><div className="flex items-end justify-between mt-2"><span className="text-3xl font-black text-emerald-600">{available.length}</span><span className="status-chip bg-emerald-50 text-emerald-700">de {sp.length}</span></div></button><button onClick={()=>setTab('medical')} className="modern-card p-4 text-left border-l-4 border-l-red-500"><div className="report-section-title">Departamento médico</div><div className="flex items-end justify-between mt-2"><span className="text-3xl font-black text-red-600">{injured.length}</span><span className="text-[10px] text-slate-400 font-bold truncate max-w-32">{injured.map(p=>p.name).join(', ')||'Sem atletas'}</span></div></button><button onClick={()=>setTab('squad')} className="modern-card p-4 text-left border-l-4 border-l-amber-500"><div className="report-section-title">Suspensos</div><div className="flex items-end justify-between mt-2"><span className="text-3xl font-black text-amber-600">{suspended.length}</span><span className="text-[10px] text-slate-400 font-bold truncate max-w-32">{suspended.map(p=>p.name).join(', ')||'Sem atletas'}</span></div></button><button onClick={openStats} className="modern-card p-4 text-left border-l-4 border-l-blue-500"><div className="report-section-title">Liga · posição e pontos</div><div className="flex items-end justify-between mt-2"><span className="text-3xl font-black text-blue-700">{seasonStats?.position?`${seasonStats.position}º`:'-'}</span><span className="status-chip bg-blue-50 text-blue-700">{points} pts · {efficiency}%</span></div></button></section>
        <section className="xl:col-span-12 grid grid-cols-2 lg:grid-cols-4 gap-3"><button onClick={()=>setTab('load')} className="modern-card p-4 text-left"><div className="report-section-title">Carga semanal</div><div className="text-2xl font-black mt-2">{weeklyLoad} <span className="text-xs text-slate-400">AU</span></div><div className="text-[9px] text-slate-400 mt-1">{weekRecords.length} sessão(ões)</div></button><button onClick={()=>setTab('load')} className="modern-card p-4 text-left"><div className="report-section-title">RPE médio</div><div className="text-2xl font-black mt-2">{weeklyAvgRpe}</div><div className="text-[9px] text-slate-400 mt-1">Escala individual 0–10</div></button><button onClick={()=>setTab('performance')} className="modern-card p-4 text-left"><div className="report-section-title">Presença nos treinos</div><div className="text-2xl font-black mt-2">{weeklyPresence?`${weeklyPresence}%`:'-'}</div><div className="text-[9px] text-slate-400 mt-1">{presentCount}/{attendanceCount||0} registros</div></button><button onClick={()=>setTab('session')} className="modern-card p-4 text-left"><div className="report-section-title">Volume realizado</div><div className="text-2xl font-black mt-2">{weeklyVolume} <span className="text-xs text-slate-400">min</span></div><div className="text-[9px] text-slate-400 mt-1">Semana atual</div></button></section>
        <section className="modern-card p-5 xl:col-span-4"><div className="flex justify-between items-start mb-4"><div><div className="report-section-title">Agenda do dia</div><h3 className="text-lg font-black">Compromissos e treino</h3></div><button onClick={()=>setTab('calendar')} className="text-blue-600"><Icon name="calendar"/></button></div><div className="space-y-2">{agenda.length?agenda.slice(0,6).map((item,index)=><div key={index} className="flex gap-3 items-center border rounded-xl p-3 bg-slate-50"><div className={`w-2 h-10 rounded-full ${item.kind==='session'?'bg-blue-600':item.kind==='calendar'?'bg-amber-500':'bg-emerald-500'}`}></div><div className="flex-1 min-w-0"><div className="text-xs font-black truncate">{item.label}</div><div className="text-[9px] text-slate-400 font-bold">{item.detail}</div></div><span className="text-[10px] text-slate-500 font-black">{item.time}</span></div>):<div className="border-2 border-dashed rounded-2xl py-10 text-center"><Icon name="calendar" className="mx-auto text-slate-300"/><div className="text-xs text-slate-400 mt-2">Nenhum compromisso cadastrado hoje.</div><button onClick={()=>setTab('session')} className="text-[10px] font-black text-blue-600 mt-2">CRIAR SESSÃO</button></div>}</div></section>

const PlayerProfileModal = ({ player, playerIndex, themeColor, onClose, onUpdate, onUpdateStat, history }) => {

const PerformanceView = ({ players, history, themeColor }) => {
    const [selectedIdx,setSelectedIdx]=useState(null); const [period,setPeriod]=useState('week'); const safe=ensureArray(players);
    const pd=useMemo(()=>{const now=new Date();now.setHours(0,0,0,0);const start=new Date(now);start.setDate(start.getDate()-((start.getDay()+6)%7));const end=new Date(start);end.setDate(end.getDate()+7);const stats=safe.map(()=>({sum:0,count:0,sessions:[]}));Object.entries(history||{}).forEach(([date,data])=>{const current=new Date(`${date}T12:00:00`);if(period==='week'&&(current<start||current>=end))return;Object.entries(data?.ratings||{}).forEach(([idx,value])=>{const rating=Number(value);if(stats[idx]&&rating>=0&&rating<=5){stats[idx].sum+=rating;stats[idx].count+=1;stats[idx].sessions.push({date,rating});}});});return safe.map((player,idx)=>{const stat=stats[idx];return {...player,idx,avg:stat.count?Number((stat.sum/stat.count).toFixed(1)):0,count:stat.count,sessions:stat.sessions.sort((a,b)=>new Date(a.date)-new Date(b.date))};}).sort((a,b)=>b.avg-a.avg||b.count-a.count||a.name.localeCompare(b.name));},[players,history,period]);
    const selected=pd.find(p=>p.idx===selectedIdx)||null; const evaluated=pd.filter(p=>p.count>0); const sessionCount=new Set(evaluated.flatMap(p=>p.sessions.map(s=>s.date))).size;
    return <div className="h-full overflow-y-auto bg-slate-50 p-4 md:p-6 animate-fade-in"><div className="flex flex-wrap justify-between gap-3 items-end mb-5"><div><div className="report-section-title">Rendimento individual</div><h2 className="text-2xl font-black">Desempenho dos atletas</h2><p className="text-xs text-slate-500 mt-1">Comparação por estrelas registradas em cada sessão de treino.</p></div><div className="flex gap-2"><button onClick={()=>setPeriod('week')} className={`btn-secondary ${period==='week'?'!bg-slate-900 !text-white':''}`}>Semana atual</button><button onClick={()=>setPeriod('all')} className={`btn-secondary ${period==='all'?'!bg-slate-900 !text-white':''}`}>Todo histórico</button></div></div>

v><div className="text-2xl font-black text-slate-300">X</div><div className="flex flex-col items-center w-24"><div className="w-16 h-16 bg-slate-100 rounded-full border mb-1 flex items-center justify-center overflow-hidden">{matchData.logo?<img src={matchData.logo} className="w-full h-full object-contain"/>:<span className="text-[9px]">ELES</span>}</div><input className="w-12 text-center text-3xl font-black border rounded" value={matchData.gTh||0} onChange={e=>setMatchData({...matchData,gTh:e.target.value})}/></div></div><div className="mt-4 flex gap-2 justify-center"><input type="date" className="border-b text-xs text-center font-bold" value={matchData.date||''} onChange={e=>setMatchData({...matchData,date:e.target.value})}/><input className="border-b text-xs text-center font-bold uppercase" placeholder="ADVERSÁRIO" value={matchData.opponent||''} onChange={e=>setMatchData({...matchData,opponent:e.target.value})}/></div></div><div className="bg-white p-4 rounded-xl shadow-sm border"><div className="text-xs font-bold text-slate-400 uppercase mb-2">Escalar (Clique)</div><div className="flex flex-wrap gap-2 max-h-32 overflow-y-auto">{ensureArray(players).map((p, i)=>(<div key={i} onClick={()=>toggleStarter(i)} className={`cursor-pointer border rounded-full px-2 py-1 text-[10px] font-bold flex items-center gap-1 ${ensureArray(matchData.starters).includes(i)?'bg-green-500 text-white border-green-600':'bg-slate-50'}`}>{p.name}</div>))}</div></div><div className="bg-white p-4 rounded-xl shadow-sm border"><div className="text-xs font-bold text-slate-400 uppercase mb-2">Eventos (Selecione)</div><div className="grid grid-cols-4 md:grid-cols-6 gap-2 mb-3 max-h-32 overflow-y-auto p-1">{ensureArray(players).map((p, i)=>(<div key={i} onClick={()=>setMatchData({...matchData, sel: i})} className={`player-select-card ${matchData.sel===i?'selected':''}`}><span className="text-[9px] font-bold truncate w-full text-center">{p.name}</span></div>))}</div><div className="grid grid-cols-4 g const MicrocycleView = ({ micro, setMicro, themeColor, calendar, library, currentSessionDate, teamName, teamLogo, onOpenSession, onAddExercise, onRemoveExercise, onDateChange, onLinkCurrentSession, sessionHistory }) => {
    const days=['SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO','DOMINGO'];
    const todayIndex=(new Date().getDay()+6)%7;
    const [selectedDay,setSelectedDay]=useState(days[todayIndex]);
    const [search,setSearch]=useState('');
    const [showLibrary,setShowLibrary]=useState(false);
    const [templates,setTemplates]=useSafeStorage('pc_microcycle_templates_v1',[]);
    const [templateName,setTemplateName]=useState('Semana modelo');
    const [selectedTemplate,setSelectedTemplate]=useState('');
    const updateDay=(day,patch)=>setMicro({...micro,[day]:{blocks:[],exercises:[],...(micro?.[day]||{}),...patch}});
    const selected=micro?.[selectedDay]||{blocks:[],exercises:[]};
    const query=search.trim().toLowerCase();
    const filtered=ensureArray(library).filter(item=>!query||`${item.name||''} ${item.desc||''} ${item.method||''}`.toLowerCase().includes(query)).slice(0,8);
    const removeExercise=(day,index)=>{if(onRemoveExercise)onRemoveExercise(day,index);else{const current=micro?.[day]||{};updateDay(day,{exercises:ensureArray(current.exercises).filter((_,i)=>i!==index)});}};
    const addFromLibrary=(item)=>{if(onAddExercise)onAddExercise(item,selectedDay);else updateDay(selectedDay,{exercises:[...ensureArray(selected.exercises),{...item,id:Date.now()}]});};
    const printDays=days.map(day=>{const data=micro?.[day]||{};const exercises=ensureArray(data.exercises);const previews=exercises.slice(0,4).map(exercise=>({name:exercise.name||'Exercício',image:exercise.image||''}));if(!previews.length&&data.image)previews.push({name:'Imagem do dia',image:data.image});return {day,data,exercises,previews,minutes:exercises.reduce((sum,item)=>sum+(parseInt(item.time)||0),0)};}); const totalExercises=printDays.reduce((sum,item)=>sum+item.exercises.length,0); const totalMinutes=printDays.reduce((sum,item)=>sum+item.minutes,0); const dated=printDays.map(item=>item.data.date).filter(Boolean).sort(); const weekLabel=dated.length?`${formatDateBR(dated[0])} a ${formatDateBR(dated[dated.length-1])}`:'Semana sem datas definidas';

const QRCodeBox = ({ value, size=76 }) => {
    const ref = useRef(null);
    useEffect(() => {
        if (!ref.current) return;
        ref.current.innerHTML = '';
        if (value && window.QRCode) new window.QRCode(ref.current, { text:value, width:size, height:size, colorDark:'#0f172a', colorLight:'#ffffff', correctLevel:window.QRCode.CorrectLevel.M });
    }, [value, size]);
    if (!value) return null;
    return <div className="flex flex-col items-center gap-1"><div ref={ref} className="bg-white p-1 rounded border"></div><span className="text-[8px] font-bold text-slate-400 uppercase">Vídeo</span></div>;
};

const SignaturePad = ({ value, onChange, label='Assinatura do treinador' }) => {
    const canvasRef = useRef(null); const drawing = useRef(false);
    useEffect(() => { const c=canvasRef.current; if(!c||!value)return; const img=new Image(); img.onload=()=>{const x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);}; img.src=value; }, []);
    const point = (e) => { const c=canvasRef.current, r=c.getBoundingClientRect(), p=e.touches?e.touches[0]:e; return {x:(p.clientX-r.left)*(c.width/r.width),y:(p.clientY-r.top)*(c.height/r.height)}; };
    const start = (e) => { drawing.current=true; const p=point(e),x=canvasRef.current.getContext('2d');x.beginPath();x.moveTo(p.x,p.y);e.preventDefault(); };
    const move = (e) => { if(!drawing.current)return; const p=point(e),x=canvasRef.current.getContext('2d');x.lineWidth=2.2;x.lineCap='round';x.strokeStyle='#0f172a';x.lineTo(p.x,p.y);x.stroke();e.preventDefault(); };
    const end = () => { if(!drawing.current)return;drawing.current=false;onChange(canvasRef.current.toDataURL('image/png')); };
    const clear = () => { const c=canvasRef.current;c.getContext('2d').clearRect(0,0,c.width,c.height);onChange(''); };
    return <div><div className="flex justify-between items-center mb-1"><label className="report-section-title">{label}</label><button onClick={clear} className="text-[10px] font-bold text-red-500 no-print">Limpar</button></div><canvas ref={canvasRef} width="520" height="130" onMouseDown={start} onMouseMove={move} onMouseUp={end} onMouseLeave={end} onTouchStart={start} onTouchMove={move} onTouchEnd={end} className="w-full h-28 bg-white border border-dashed border-slate-300 rounded-xl touch-none"></canvas></div>;
};

const ModernLineupView = ({ players, history, themeColor }) => {

                {slots.map((s,i)=>{const playerIndex=lineup[i],p=safe[playerIndex],perf=weekly[playerIndex];return <button key={i} onClick={()=>setSlot(i)} className={`absolute -translate-x-1/2 -translate-y-1/2 flex flex-col items-center z-10 ${slot===i?'scale-110':''}`} style={{left:`${s.x}%`,top:`${s.y}%`}}>{p&&perf?.count>0&&<span className="mb-1 bg-amber-400 text-slate-950 px-2 py-0.5 rounded-full text-[9px] font-black shadow">★ {perf.avg.toFixed(1)}</span>}<div className={`w-14 h-14 rounded-full border-[3px] shadow-xl overflow-hidden flex items-center justify-center ${p?'bg-white border-white':'bg-slate-900/75 border-white/60'}`}>{p&&p.image?<img src={p.image} className="w-full h-full object-cover"/>:<span className="text-white text-[10px] font-black">{p?p.name.slice(0,2).toUpperCase():s.p}</span>}</div><span className="mt-1 bg-slate-950/90 text-white px-2 py-1 rounded-full text-[9px] font-bold max-w-24 truncate">{p?p.name.split(' ')[0]:'Selecionar'}</span></button>})}

        </div>
    </div>;
};

const ModernSessionView = ({ drills,setDrills,header,setHeader,logo,themeColor,players,history,setHistory,sessionDate,setSessionDate,teamName,syncMicrocycle }) => {
    const record=(history&&history[sessionDate])||{}; const [attendance,setAttendance]=useState(record.attendance||{}); const [rpe,setRpe]=useState(record.rpe||{}); const [ratings,setRatings]=useState(record.ratings||{}); const [actual,setActual]=useState(record.actualDuration||''); const [review,setReview]=useState(record.review||{rating:0,outcomes:'',improvements:'',incidents:''}); const [signature,setSignature]=useState(record.signature||''); const [section,setSection]=useState('plan');

const TacticalBoardLegacy = () => {
    const [boards,setBoards]=useSafeStorage('pc_tactical_boards_v2',[]); const [items,setItems]=useState([]); const [arrows,setArrows]=useState([]); const [name,setName]=useState('Novo modelo tático'); const [tool,setTool]=useState('select'); const [start,setStart]=useState(null); const [drag,setDrag]=useState(null); const [past,setPast]=useState([]); const [future,setFuture]=useState([]); const svgRef=useRef(null);
    const snapshot=()=>({items:JSON.parse(JSON.stringify(items)),arrows:JSON.parse(JSON.stringify(arrows))});
    const commit=(nextItems=items,nextArrows=arrows)=>{setPast([...past,snapshot()].slice(-30));setFuture([]);setItems(nextItems);setArrows(nextArrows);};
    const undo=()=>{if(!past.length)return;const previous=past[past.length-1];setFuture([snapshot(),...future]);setItems(previous.items);setArrows(previous.arrows);setPast(past.slice(0,-1));};
    const redo=()=>{if(!future.length)return;const next=future[0];setPast([...past,snapshot()]);setItems(next.items);setArrows(next.arrows);setFuture(future.slice(1));};
    const point=(e)=>{const rect=svgRef.current.getBoundingClientRect();return{x:Math.max(1.5,Math.min(103.5,(e.clientX-rect.left)/rect.width*105)),y:Math.max(1.5,Math.min(66.5,(e.clientY-rect.top)/rect.height*68))};};
    const add=(kind,team='blue')=>commit([...items,{id:Date.now()+Math.random(),kind,team,x:52.5,y:34,label:kind==='player'?String(items.filter(item=>item.kind==='player'&&item.team===team).length+1):''}],arrows);
    const fieldClick=(e)=>{if(tool!=='arrow'||e.target.closest('[data-item]'))return;const position=point(e);if(!start)setStart(position);else{commit(items,[...arrows,{id:Date.now(),x1:start.x,y1:start.y,x2:position.x,y2:position.y,color:'#facc15'}]);setStart(null);setTool('select');}};
    const move=(e)=>{if(!drag)return;const position=point(e);setItems(items.map(item=>item.id===drag?{...item,...position}:item));};
    const save=()=>{const board={id:Date.now(),name,items,arrows,field:'105x68',updatedAt:new Date().toISOString()};setBoards([board,...ensureArray(boards).filter(item=>item.name!==name)]);};
    const load=(id)=>{const board=ensureArray(boards).find(item=>String(item.id)===String(id));if(board){setName(board.name);setItems(board.items||[]);setArrows(board.arrows||[]);setPast([]);setFuture([]);}};
    const clear=()=>commit([],[]);
    const line={fill:'none',stroke:'rgba(255,255,255,.9)',strokeWidth:.32};
    return <div className="h-full overflow-y-auto bg-slate-50 p-4 md:p-6"><div className="flex flex-wrap justify-between gap-3 mb-4"><div><div className="report-section-title">Prancheta profissional</div><h2 className="text-2xl font-black">Campo oficial · 105 × 68 m</h2><p className="text-xs text-slate-500 mt-1">Marcações regulamentares para treino, organização tática e bolas paradas.</p></div><span className="status-chip bg-emerald-100 text-emerald-700">Proporção oficial</span></div><div className="modern-card p-4 mb-4 flex flex-wrap gap-2 items-end no-print"><div className="flex-1 min-w-48"><label className="report-section-title block mb-1">Nome do quadro</label><input className="modern-input" value={name} onChange={e=>setName(e.target.value)}/></div><button className="btn-secondary" onClick={()=>add('player','blue')}>+ Jogador azul</button><button className="btn-secondary" onClick={()=>add('player','red')}>+ Jogador vermelho</button><button className="btn-secondary" onClick={()=>add('cone','orange')}>+ Cone</button><button className="btn-secondary" onClick={()=>add('ball','white')}>+ Bola</button><button className="btn-secondary" onClick={()=>add('goal','white')}>+ Mini gol</button><button className={`btn-secondary ${tool==='arrow'?'!bg-amber-400 !text-slate-950':''}`} onClick={()=>setTool(tool==='arrow'?'select':'arrow')}><Icon name="trend"/> Seta</button><button className="btn-secondary" onClick={undo} disabled={!past.length}>Desfazer</button><button className="btn-secondary" onClick={redo} disabled={!future.length}>Refazer</button><button className="btn-primary" onClick={save}><Icon name="save"/> Salvar</button><select className="modern-input !w-56" defaultValue="" onChange={e=>load(e.target.value)}><option value="">Abrir quadro...</option>{ensureArray(boards).map(board=><option key={board.id} value={board.id}>{board.name}</option>)}</select><button className="btn-secondary !text-red-500" onClick={clear}>Limpar</button></div>
        <div className="max-w-7xl mx-auto modern-card p-3"><svg ref={svgRef} viewBox="0 0 105 68" onPointerMove={move} onPointerUp={()=>setDrag(null)} onPointerLeave={()=>setDrag(null)} onClick={fieldClick} className={`w-full aspect-[105/68] rounded-2xl field-pro ${tool==='arrow'?'cursor-crosshair':'cursor-default'}`}>
            <defs><marker id="arrowhead" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><polygon points="0 0,5 2.5,0 5" fill="#facc15"/></marker><clipPath id="leftPenaltyArc"><rect x="18" y="0" width="20" height="68"/></clipPath><clipPath id="rightPenaltyArc"><rect x="67" y="0" width="20" height="68"/></clipPath></defs>
            <rect x="1.5" y="1.5" width="102" height="65" rx=".35" {...line}/><line x1="52.5" y1="1.5" x2="52.5" y2="66.5" {...line}/><circle cx="52.5" cy="34" r="9.15" {...line}/><circle cx="52.5" cy="34" r=".34" fill="white"/>

const TacticalBoardPro = ({ players, sessionHistory, scoutingData, setScoutingData, setTab, teamName, themeColor }) => {
    const safe=ensureArray(players);
    const [boards,setBoards]=useSafeStorage('pc_tactical_boards_v3',[]);
    const [savedFormations]=useSafeStorage('pc_saved_formations_v3',[]);
    const [items,setItems]=useState([]); const [arrows,setArrows]=useState([]);
    const [name,setName]=useState('Estratégia principal'); const [system,setSystem]=useState(scoutingData?.system||'4-3-3');
    const [formationId,setFormationId]=useState(''); const [opponent,setOpponent]=useState(scoutingData?.opponent||'');
    const [opponentSystem,setOpponentSystem]=useState(scoutingData?.opponentSystem||scoutingData?.system||'4-3-3');
    const [situation,setSituation]=useState('Organização ofensiva'); const [displayMode,setDisplayMode]=useState('analysis');
    const [ourColor,setOurColor]=useState(themeColor||'#2563eb'); const [opponentColor,setOpponentColor]=useState('#ef4444');
    const [tool,setTool]=useState('select'); const [start,setStart]=useState(null); const [drag,setDrag]=useState(null);
    const [selectedItem,setSelectedItem]=useState(null); const [past,setPast]=useState([]); const [future,setFuture]=useState([]);
    const [frames,setFrames]=useState([]); const [activeFrame,setActiveFrame]=useState(0); const [note,setNote]=useState('');
    const svgRef=useRef(null);

    const formationLines={
        '4-3-3':[4,3,3], '4-4-2':[4,4,2], '4-2-3-1':[4,2,3,1], '4-1-4-1':[4,1,4,1],
        '4-3-1-2':[4,3,1,2], '4-2-2-2':[4,2,2,2], '4-5-1':[4,5,1], '3-5-2':[3,5,2],
        '3-4-3':[3,4,3], '3-4-2-1':[3,4,2,1], '5-3-2':[5,3,2], '5-4-1':[5,4,1]
    };
    const situations=['Organização ofensiva','Organização defensiva','Pressão alta','Bloco médio','Bloco baixo','Transição ofensiva','Transição defensiva','Saída de bola','Bola parada ofensiva','Bola parada defensiva','Escanteio ofensivo','Escanteio defensivo','Tiro de meta','Final de jogo — vencendo','Final de jogo — perdendo'];

    const weekly=useMemo(()=>{
        const cutoff=new Date(); cutoff.setHours(0,0,0,0); cutoff.setDate(cutoff.getDate()-6);
        const stats=safe.map(()=>({sum:0,count:0,present:0,sessions:0,load:0,avg:0}));
        Object.entries(sessionHistory||{}).forEach(([date,data])=>{
            const current=new Date(`${date}T12:00:00`); if(Number.isNaN(current.getTime())||current<cutoff)return;
            const duration=parseInt(data?.actualDuration)||ensureArray(data?.drills).reduce((total,drill)=>total+(parseInt(drill.time)||0),0);
            safe.forEach((_,index)=>{
                if(!stats[index])return; stats[index].sessions+=1;
                const attendance=data?.attendance?.[index]||'Presente'; if(attendance==='Presente')stats[index].present+=1;
                stats[index].load+=(parseInt(data?.rpe?.[index])||0)*duration;
                const rating=Number(data?.ratings?.[index]); if(rating>=0&&rating<=5){stats[index].sum+=rating;stats[index].count+=1;}
            });
        });
        return stats.map(stat=>({...stat,avg:stat.count?Number((stat.sum/stat.count).toFixed(1)):0,presence:stat.sessions?Math.round(stat.present/stat.sessions*100):0}));
    },[players,sessionHistory]);

    const snapshot=()=>({items:JSON.parse(JSON.stringify(items)),arrows:JSON.parse(JSON.stringify(arrows))});
    const commit=(nextItems=items,nextArrows=arrows)=>{setPast(previous=>[...previous,snapshot()].slice(-40));setFuture([]);setItems(nextItems);setArrows(nextArrows);};
    const undo=()=>{if(!past.length)return;const previous=past[past.length-1];setFuture(current=>[snapshot(),...current]);setItems(previous.items);setArrows(previous.arrows);setPast(past.slice(0,-1));};
    const redo=()=>{if(!future.length)return;const next=future[0];setPast(current=>[...current,snapshot()].slice(-40));setItems(next.items);setArrows(next.arrows);setFuture(future.slice(1));};
    const point=(event)=>{const rect=svgRef.current.getBoundingClientRect();return{x:Math.max(1.5,Math.min(103.5,(event.clientX-rect.left)/rect.width*105)),y:Math.max(1.5,Math.min(66.5,(event.clientY-rect.top)/rect.height*68))};};
    const markerId=(id)=>`player-${String(id).replace(/[^a-zA-Z0-9_-]/g,'')}`;

    const formationPositions=(value,team='ours')=>{
        const lines=formationLines[value]||formationLines['4-3-3']; const positions=[{x:7.5,y:34,role:'GOL'}];
        const minimum=20,maximum=77,step=lines.length>1?(maximum-minimum)/(lines.length-1):0;
        lines.forEach((count,lineIndex)=>{const x=minimum+(step*lineIndex);for(let index=0;index<count;index++){positions.push({x,y:(index+1)*68/(count+1),role:lineIndex===0?'DEF':lineIndex===lines.length-1?'ATA':'MEI'});}});
        return team==='opponent'?positions.map(position=>({...position,x:105-position.x})):positions;
    };
    const orderedPlayerIndexes=()=>safe.map((player,index)=>({player,index})).sort((a,b)=>{
        const unavailableA=a.player.injured||a.player.suspended?1:0,unavailableB=b.player.injured||b.player.suspended?1:0;
        const goalkeeperA=/gol|goleir/i.test(a.player.pos||'')?0:1,goalkeeperB=/gol|goleir/i.test(b.player.pos||'')?0:1;
        return unavailableA-unavailableB||goalkeeperA-goalkeeperB||((weekly[b.index]?.avg||0)-(weekly[a.index]?.avg||0));
    }).map(entry=>entry.index);
    const selectedFormation=ensureArray(savedFormations).find(formation=>String(formation.id)===String(formationId));
    const getFormationIndexes=()=>{

        const unique=[...new Set(stored)]; orderedPlayerIndexes().forEach(index=>{if(!unique.includes(index))unique.push(index);}); return unique.slice(0,11);
    };
    const loadOurTeam=()=>{

        const team=positions.map((position,index)=>{const playerIndex=indexes[index],profile=safe[playerIndex]||{};return{id:`ours-${Date.now()}-${index}`,kind:'player',team:'ours',playerIndex,label:String(profile.number||index+1),...position};});

    };

    };
    const fieldClick=(event)=>{if(tool!=='arrow'||event.target.closest?.('[data-item]'))return;const position=point(event);if(!start)setStart(position);else{commit(items,[...arrows,{id:`arrow-${Date.now()}`,x1:start.x,y1:start.y,x2:position.x,y2:position.y,color:'#facc15'}]);setStart(null);setTool('select');}};
    const move=(event)=>{if(!drag)return;const position=point(event);setItems(current=>current.map(item=>item.id===drag?{...item,...position}:item));};

    const applySituation=()=>{
        let next=items.map(item=>({...item})); const generated=[];
        const ours=()=>next.filter(item=>item.team==='ours'&&item.kind==='player'); const rivals=()=>next.filter(item=>item.team==='opponent'&&item.kind==='player');
        const shift=(team,amount,min=4,max=101)=>{next=next.map(item=>item.team===team&&item.kind==='player'?{...item,x:Math.max(min,Math.min(max,item.x+amount))}:item);};
        const addForwardArrows=(list,amount,color)=>list.slice().sort((a,b)=>b.x-a.x).slice(0,5).forEach((item,index)=>generated.push({id:`auto-${Date.now()}-${index}-${item.id}`,x1:item.x,y1:item.y,x2:Math.max(2,Math.min(103,item.x+amount)),y2:Math.max(3,Math.min(65,item.y+(index%2?2:-2))),color}));

            const base=formationPositions(system,'ours'); next=next.map(item=>{if(item.team!=='ours'||item.kind!=='player')return item;const index=ours().findIndex(entry=>entry.id===item.id),position=base[index]||item;return{...item,x:Math.min(position.x,58),y:position.y};});
            setBall(9,34); const team=ours(); if(team[0])team.slice(1,5).forEach((item,index)=>generated.push({id:`build-${Date.now()}-${index}`,x1:team[0].x,y1:team[0].y,x2:item.x,y2:item.y,color:'#facc15'}));
        }

            setBall(situation==='Escanteio ofensivo'?102:76,situation==='Escanteio ofensivo'?3:34); addForwardArrows(ours(),8,'#facc15');
        }
        if(situation==='Bola parada defensiva'||situation==='Escanteio defensivo'){
            const defending=ours().slice(1); next=next.map(item=>{const index=defending.findIndex(entry=>entry.id===item.id);return index<0?item:{...item,x:7+(index%3)*5,y:8+(index*7)%54};});
            setBall(situation==='Escanteio defensivo'?3:29,situation==='Escanteio defensivo'?3:34);
        }
        if(situation==='Final de jogo — perdendo'){shift('ours',17,8,98);addForwardArrows(ours(),12,'#facc15');}
        commit(next,generated); if(name==='Estratégia principal'||!name.trim())setName(`${situation}${opponent?` · ${opponent}`:''}`);
    };

    const frameData=(frameName,index)=>({id:frames[index]?.id||`frame-${Date.now()}-${index}`,name:frameName||`Quadro ${index+1}`,items:JSON.parse(JSON.stringify(items)),arrows:JSON.parse(JSON.stringify(arrows)),note});
    const saveFrame=()=>{if(!frames.length){setFrames([frameData('Quadro 1',0)]);setActiveFrame(0);return;}setFrames(frames.map((frame,index)=>index===activeFrame?frameData(frame.name,index):frame));};
    const addFrame=()=>{const base=frames.length?frames.map((frame,index)=>index===activeFrame?frameData(frame.name,index):frame):[frameData('Quadro 1',0)];const next=frameData(`Quadro ${base.length+1}`,base.length);setFrames([...base,next]);setActiveFrame(base.length);};
    const openFrame=(index)=>{const frame=frames[index];if(!frame)return;setActiveFrame(index);setItems(JSON.parse(JSON.stringify(frame.items||[])));setArrows(JSON.parse(JSON.stringify(frame.arrows||[])));setNote(frame.note||'');setPast([]);setFuture([]);};
    const removeFrame=(index)=>{const remaining=frames.filter((_,position)=>position!==index);setFrames(remaining);const target=Math.max(0,Math.min(activeFrame,remaining.length-1));setActiveFrame(target);if(remaining[target])openFrame(target);};

    const save=()=>{
        const storedFrames=frames.length?frames.map((frame,index)=>index===activeFrame?frameData(frame.name,index):frame):[frameData('Quadro 1',0)];
        const board={id:Date.now(),name:name||'Estratégia sem nome',teamName,items,arrows,frames:storedFrames,activeFrame,system,opponentSystem,situation,opponent,displayMode,ourColor,opponentColor,note,field:'105x68',updatedAt:new Date().toISOString()};
        setBoards([board,...ensureArray(boards).filter(item=>item.name!==board.name)]); setFrames(storedFrames);
        if(setScoutingData)setScoutingData({...scoutingData,opponent:opponent||scoutingData?.opponent||'',opponentSystem,tacticalBoard:{id:board.id,name:board.name,system:board.system,opponentSystem:board.opponentSystem,situation:board.situation,frames:storedFrames.length,updatedAt:board.updatedAt}});
    };
    const load=(id)=>{const board=ensureArray(boards).find(item=>String(item.id)===String(id));if(!board)return;setName(board.name||'Estratégia');setSystem(board.system||'4-3-3');setOpponentSystem(board.opponentSystem||'4-3-3');setSituation(board.situation||'Organização ofensiva');setOpponent(board.opponent||'');setDisplayMode(board.displayMode||'analysis');setOurColor(board.ourColor||themeColor||'#2563eb');setOpponentColor(board.opponentColor||'#ef4444');setNote(board.note||'');const stored=ensureArray(board.frames);setFrames(stored);const index=Math.min(board.activeFrame||0,Math.max(0,stored.length-1));setActiveFrame(index);const current=stored[index];setItems(current?.items||board.items||[]);setArrows(current?.arrows||board.arrows||[]);setPast([]);setFuture([]);};
    const clear=()=>{commit([],[]);setFrames([]);setActiveFrame(0);setSelectedItem(null);};
    const exportPng=()=>{
        const source=svgRef.current;if(!source)return;const clone=source.cloneNode(true);clone.setAttribute('xmlns','http://www.w3.org/2000/svg');clone.setAttribute('width','1575');clone.setAttribute('height','1020');const blob=new Blob([new XMLSerializer().serializeToString(clone)],{type:'image/svg+xml;charset=utf-8'}),url=URL.createObjectURL(blob),picture=new Image();
        picture.onload=()=>{const canvas=document.createElement('canvas');canvas.width=1575;canvas.height=1020;const context=canvas.getContext('2d');context.drawImage(picture,0,0,canvas.width,canvas.height);URL.revokeObjectURL(url);try{canvas.toBlob(file=>{if(!file)return;const download=document.createElement('a');download.href=URL.createObjectURL(file);download.download=`${(name||'estrategia').replace(/[^a-z0-9]+/gi,'-').toLowerCase()}.png`;download.click();setTimeout(()=>URL.revokeObjectURL(download.href),1000);},'image/png');}catch(error){alert('Uma foto externa bloqueou a exportação. Salve as fotos dos atletas no perfil e tente novamente.');}};picture.onerror=()=>{URL.revokeObjectURL(url);alert('Não foi possível gerar a imagem desta estratégia.');};picture.src=url;
    };

    const selected=items.find(item=>item.id===selectedItem); const selectedProfile=selected?.playerIndex!==undefined?safe[selected.playerIndex]:null; const selectedPerformance=selected?.playerIndex!==undefined?weekly[selected.playerIndex]:null;
    const fieldIndexes=new Set(items.filter(item=>item.team==='ours'&&item.playerIndex!==undefined).map(item=>item.playerIndex));
    const bench=safe.map((player,index)=>({player,index,performance:weekly[index]})).filter(entry=>!fieldIndexes.has(entry.index)).sort((a,b)=>(b.performance?.avg||0)-(a.performance?.avg||0));
    const line={fill:'none',stroke:'rgba(255,255,255,.92)',strokeWidth:.32};
    const performanceLabel=(performance)=>!performance?.count?'Sem avaliação':performance.avg>=4.2?'Excelente momento':performance.avg>=3.4?'Bom momento':'Em atenção';

    return <div className="h-full overflow-y-auto bg-slate-50 p-4 md:p-6">
        <div className="flex flex-wrap justify-between gap-3 mb-4"><div><div className="report-section-title">Centro tático profissional</div><h2 className="text-2xl font-black">Nossa equipe, adversário e estratégia</h2><p className="text-xs text-slate-500 mt-1">Campo oficial 105 × 68 m, fotos do elenco, desempenho semanal e quadros sequenciais.</p></div><div className="flex gap-2"><span className="status-chip bg-emerald-100 text-emerald-700">Campo oficial</span><span className="status-chip bg-blue-100 text-blue-700">{items.filter(item=>item.team==='ours').length} atletas em campo</span></div></div>

n)+(+w.stress))/4,level=avg>=4?'red':avg>=3?'amber':'green';return <tr key={w.id} className="border-t"><td className="p-3 font-bold">{safe[w.player]?.name}</td><td className="text-center">{w.sleep}</td><td className="text-center">{w.fatigue}</td><td className="text-center">{w.pain}</td><td className="text-center">{w.stress}</td><td className="text-center"><span className={`status-chip bg-${level}-100 text-${level}-700`}>{level==='red'?'Avaliar':level==='amber'?'Atenção':'Liberado'}</span></td></tr>})}</tbody></table></div></>);

const SmartLibraryView = ({ lib,setLib,onAddS,onSchedule,tC,sessionHistory,scoutingHistory,matchHistory }) => {

    const [tags,setTags]=useSafeStorage('pc_library_tags_v1',{});
    const [galleryDrafts,setGalleryDrafts]=useState({});
    const [mediaStatus,setMediaStatus]=useState({});

    const makeCover=(id,url)=>patchItem(id,item=>({...item,image:url,imageUrl:url}));
    const optimizeImage=(file)=>new Promise((resolve,reject)=>{if(!file||!String(file.type||'').startsWith('image/'))return reject(new Error('Selecione um arquivo de imagem.'));const reader=new FileReader();reader.onerror=()=>reject(new Error('Não foi possível ler a imagem.'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(new Error('Formato de imagem não suportado.'));img.onload=()=>{const max=1200;const scale=Math.min(1,max/Math.max(img.width||1,img.height||1));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);resolve(canvas.toDataURL('image/jpeg',0.82));};img.src=reader.result;};reader.readAsDataURL(file);});
    const uploadImages=async(id,fileList)=>{const files=Array.from(fileList||[]).slice(0,5);if(!files.length)return;setMediaStatus({...mediaStatus,[id]:'Processando imagem...'});try{for(const file of files){if(file.size>8*1024*1024)throw new Error(`${file.name}: máximo 8 MB por arquivo.`);const dataUrl=await optimizeImage(file);addImage(id,dataUrl,'Upload local');}setMediaStatus({...mediaStatus,[id]:`${files.length} imagem(ns) adicionada(s).`});setTimeout(()=>setMediaStatus(current=>({...current,[id]:''})),2600);}catch(error){setMediaStatus({...mediaStatus,[id]:error.message||'Falha ao processar imagem.'});}};

    return <div className="h-full overflow-y-auto bg-slate-50 p-4 md:p-6">

                            <button onClick={() => setDarkMode(!darkMode)} className="p-2.5 rounded-xl hover:bg-slate-100 text-slate-400 no-print transition-colors" title={darkMode ? "Modo claro" : "Modo escuro"}><Icon name={darkMode ? "sun" : "moon"}/></button>
                            <button onClick={printActiveView} className="hidden sm:block p-2.5 rounded-xl hover:bg-slate-100 text-slate-400 no-print transition-colors" title="Exportar PDF da tela atual"><Icon name="printer"/></button>
                            <button onClick={()=>setShowSettings(true)} className="p-2.5 rounded-xl hover:bg-slate-100 text-slate-400 no-print transition-colors" title="Configurações"><Icon name="settings"/></button>
                            {auth && <button onClick={()=>auth.signOut()} className="p-2.5 rounded-xl hover:bg-red-50 text-red-400 no-print transition-colors" title="Sair"><Icon name="logout"/></button>}
                        </div>
                    </header>
                    {activeGroup.items.length>1 && <div className="md:hidden flex bg-white border-b px-3 py-2 gap-2 overflow-x-auto no-print shrink-0">{activeGroup.items.map(item => <button key={item.tab} onClick={()=>setTab(item.tab)} className={`shrink-0 px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 ${tab===item.tab?'text-white shadow':'bg-slate-100 text-slate-500'}`} style={{backgroundColor:tab===item.tab?themeColor:''}}><Icon name={item.icon} size={14}/>{item.label}</button>)}</div>}

                    <div className="app-content flex-1 overflow-hidden relative">
                {tab === 'dashboard' && <DashboardView themeColor={themeColor} players={playersRaw} matchHistory={matchHistoryRaw} history={sessionHistory} setTab={setTab} teamLogo={teamLogo} teamName={teamName} scoutingData={scoutingData} microData={microData} calendarData={calendarData} header={header} seasonStats={seasonStats} openStats={()=>setShowStatsModal(true)} notices={noticesRaw} setNotices={setNotices} />}
                {tab === 'squad' && <SquadView players={playersRaw} setPlayers={setPlayers} themeColor={themeColor} history={sessionHistory} />}
                {tab === 'lineup' && <ModernLineupView players={playersRaw} history={sessionHistory} themeColor={themeColor} />}
                {tab === 'decision' && <DecisionSupportView players={playersRaw} sessionHistory={sessionHistory} matchHistory={matchHistoryRaw} themeColor={themeColor} setTab={setTab} />}
                {tab === 'player360' && <Player360ProView players={playersRaw} setPlayers={setPlayers} sessionHistory={sessionHistory} matchHistory={matchHistoryRaw} themeColor={themeColor} />}
                {tab === 'performance' && <PerformanceView players={playersRaw} history={sessionHistory} themeColor={themeColor} />}
                {tab === 'gamecenter' && <GameCenterView themeColor={themeColor} teamName={teamName} teamLogo={teamLogo} players={playersRaw} scoutingData={scoutingData} setScoutingData={setScoutingData} scoutingHistory={scoutingHistoryRaw} setScoutingHistory={setScoutingHistory} matchData={matchData} setMatchData={setMatchData} matchHistory={matchHistoryRaw} setMatchHistory={setMatchHistory} sessionHistory={sessionHistory} setTab={setTab} />}
                {tab === 'scouting' && <ScoutingView themeColor={themeColor} scoutingData={scoutingData} setScoutingData={setScoutingData} scoutingHistory={scoutingHistoryRaw} setScoutingHistory={setScoutingHistory} />}
                {tab === 'opponenthistory' && <OpponentHistoryView scoutingData={scoutingData} setScoutingData={setScoutingData} scoutingHistory={scoutingHistoryRaw} matchHistory={matchHistoryRaw} sessionHistory={sessionHistory} teamName={teamName} />}
                {tab === 'session' && <ModernSessionView drills={sessionDrills} setDrills={setSessionDrills} header={header} setHeader={setHeader} logo={teamLogo} themeColor={themeColor} players={playersRaw} history={sessionHistory} setHistory={setSessionHistory} sessionDate={sessionDate} setSessionDate={setSessionDate} teamName={teamName} syncMicrocycle={(drills)=>syncSessionToMicrocycle(drills,sessionDate)} />}
                {tab === 'postmatch' && <ModernMatchReportView themeColor={themeColor} matchData={matchData} setMatchData={setMatchData} players={playersRaw} setPlayers={setPlayers} matchHistory={matchHistoryRaw} setMatchHistory={setMatchHistory} teamLogo={teamLogo} teamName={teamName} />}
                {tab === 'micro' && <MicrocycleView micro={microData} setMicro={setMicroData} themeColor={themeColor} calendar={calendarData} library={libraryDrillsRaw} currentSessionDate={sessionDate} teamName={teamName} teamLogo={teamLogo} onOpenSession={openSessionFromMicrocycle} onAddExercise={addExerciseToMicrocycle} onRemoveExercise={removeExerciseFromMicrocycle} onDateChange={connectMicrocycleDate} onLinkCurrentSession={(day)=>syncSessionToMicrocycle(sessionDrills,sessionDate,day)} sessionHistory={sessionHistory} />}
                {tab === 'board' && <VisualBoardView currentWeekStart={getMonday(boardWeekDate)} changeWeek={(d)=>{const n=new Date(boardWeekDate); n.setDate(n.getDate()+d); setBoardWeekDate(n);}} boardData={boardHistory[getWeekKey(boardWeekDate)]||{}} updateBoardData={(d,i)=>{const k=getWeekKey(boardWeekDate); setBoardHistory({...boardHistory, [k]:{...(boardHistory[k]||{}), [d]:i}});}} themeColor={themeColor} />}
                {tab === 'calendar' && <CalendarView calendar={calendarData} setCalendar={setCalendarData} themeColor={themeColor} notices={noticesRaw} />}
                {tab === 'library' && <SmartLibraryView lib={libraryDrillsRaw} setLib={setLibraryDrills} onAddS={(item)=>addExerciseToSession(item,sessionDate)} onSchedule={scheduleExercise} tC={themeColor} sessionHistory={sessionHistory} scoutingHistory={scoutingHistoryRaw} matchHistory={matchHistoryRaw} />}
                {tab === 'tactical' && <TacticalBoardPro players={playersRaw} sessionHistory={sessionHistory} scoutingData={scoutingData} setScoutingData={setScoutingData} setTab={setTab} teamName={teamName} themeColor={themeColor} />}
                {tab === 'diary' && <CoachDiaryView teamName={teamName} sessionHistory={sessionHistory} matchHistory={matchHistoryRaw} scoutingData={scoutingData} />}
                {tab === 'mentor' && <MentorCoachView players={playersRaw} sessionHistory={sessionHistory} matchHistory={matchHistoryRaw} scoutingData={scoutingData} microData={microData} setMicroData={setMicroData} library={libraryDrillsRaw} themeColor={themeColor} />}
                {tab === 'reports' && <ProfessionalReportsView teamName={teamName} teamLogo={teamLogo} players={playersRaw} sessionHistory={sessionHistory} matchHistory={matchHistoryRaw} themeColor={themeColor} />}
                {['wellness','load','medical','contracts','season','communication','portal','roles','assistant','versions'].includes(tab) && <ClubModuleView mode={tab} players={playersRaw} sessionHistory={sessionHistory} teamName={teamName} themeColor={themeColor} />}
                {tab === 'printcenter' && <PrintCenterView teamName={teamName} teamLogo={teamLogo} sessionHistory={sessionHistory} matchHistory={matchHistoryRaw} />}
                    </div>
                </main>
            </div>
            <nav className="mobile-main-nav md:hidden fixed bottom-0 inset-x-0 bg-white border-t shadow-[0_-4px_18px_rgba(15,23,42,0.10)] z-40 flex justify-start overflow-x-auto px-1 pt-1 no-print">
                {navigationGroups.map(group => <button key={group.id} onClick={()=>openGroup(group)} className={`mobile-main-button shrink-0 w-20 rounded-xl flex flex-col items-center justify-center gap-1 text-[9px] font-bold ${activeGroup.id===group.id?'bg-slate-100':'text-slate-400'}`} style={{color:activeGroup.id===group.id?themeColor:''}}><Icon name={group.icon} size={19}/><span className="truncate max-w-[74px]">{group.label}</span></button>)}
            </nav>
        </div>
    );
};

const MainControl = () => {
    const [user, setUser] = useState(null); const [loading, setLoading] = useState(true);
    useEffect(() => {
        const setLoadingProgress=(text,percent)=>{const label=document.getElementById('loading-text'),bar=document.getElementById('loading-progress-bar'),value=document.getElementById('loading-percent');if(label)label.innerText=text;if(bar)bar.style.width=`${percent}%`;if(value)value.innerText=`${percent}%`;};
        const finishLoading=()=>{clearTimeout(window.__pcBootGuard);setLoadingProgress('Painel pronto',100);setTimeout(()=>{setLoading(false);const l=document.getElementById('loading');if(l){l.style.opacity='0';l.style.transition='opacity .25s ease';setTimeout(()=>l.style.display='none',260);}},220);};
        setLoadingProgress('Validando acesso',28);
        if (!auth) { setLoadingProgress('Abrindo dados locais',86); finishLoading(); return; }
        const t = setTimeout(() => { setLoadingProgress('Abrindo no modo local',92); finishLoading(); }, 8000);
        const un = auth.onAuthStateChanged(async (u) => {
            clearTimeout(t);
            if (u && db) {
                try {
                    setLoadingProgress('Sincronizando dados da equipe',58);
                    const doc = await db.collection('coachData').doc(u.uid).get({ source: 'default' });
                    if (doc.exists) {
                        const d = doc.data(); Object.keys(d).forEach(k => { if (k.startsWith('pc_')) { window.localStorage.setItem(k, typeof d[k] === 'string' ? d[k] : JSON.stringify(d[k])); } });
                    }
                    setLoadingProgress('Preparando indicadores',86);
                } catch(e) { setLoadingProgress('Usando dados disponíveis no aparelho',86); }
            }
            setUser(u); finishLoading();
        });
        return () => {clearTimeout(t);un();};
    }, []);

    if (loading) return null;
    if (!user && auth) return <AuthScreen />;
    return <App user={user} />;
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ErrorBoundary><MainControl /></ErrorBoundary>);
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
</script>
</body>

</html>
